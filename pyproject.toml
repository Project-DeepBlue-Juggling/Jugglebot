[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--ignore=tests/hardware",
    "--strict-markers",
    # ── ROS2 Foxy plugin suppression ──────────────────────────────────────
    # These names are pytest11 ENTRY-POINT names, not module names.  The
    # launch plugins ship as `launch` / `launch_ros` (see
    # /opt/ros/foxy/.../launch_testing-*.egg-info/entry_points.txt), so the
    # obvious-looking `no:launch_testing` / `no:launch_testing_ros` silently
    # match nothing and leave the plugins ACTIVE.  That matters: the launch
    # plugin imports every collected module at collection time, so a single
    # unimportable test file aborts the whole run as a collection error
    # instead of failing one file.  Verify with `pytest --trace-config`.
    "-p", "no:launch",
    "-p", "no:launch_ros",
    "-p", "no:ament_copyright",
    "-p", "no:ament_flake8",
    "-p", "no:ament_pep257",
    "-p", "no:ament_xmllint",
    "-p", "no:ament_lint",
]
markers = [
    # `slow` was DELETED 2026-08-01. It had exactly one use (test_zmq_corruption,
    # a ~9 s module — the mark was untrue as well as unused) and nothing ever
    # selected on it. Runtime is not a tiering axis here; CONTENT is. Left
    # unregistered deliberately: under --strict-markers a new @pytest.mark.slow
    # is now a hard error that points the author at `nightly` instead.
    "nightly: NOT run by the per-commit gate. ./run_tests.sh deselects these; they run every night at 04:00 (tools/nightly_suite.sh -> ./run_tests.sh --full --hypothesis-profile=ci-deep, systemd --user jugglebot-nightly.timer) and on any explicit `./run_tests.sh --full`, which is MANDATORY before a hardware sitting and at plan-phase closure. The boundary is CONTENT, never runtime: research/demo characterization (the juggle-demo e2e, the self-catch BREAK sweeps) and code that is operationally dormant (the ZMQ target-ingest and catch-optimiser batteries: since the MPC chain's removal on 2026-09-01 nothing publishes on :5558 and no live path calls the catch optimiser, so both are demo/reference surfaces rather than shipping ones). The hardware-safety surface — teensy_link wire bytes, firmware natives, ROS nodes, motion/ — is NEVER demoted. ONE carve-out, added 2026-08-01 with the reasoning written down rather than left implicit: three tests under tests/motion/ are nightly (test_motor_guard.py::test_loop_timing, ::test_ipc_latency, test_motor_guard_friction_ff.py::test_friction_ff_no_steady_state_alloc). They are CONTENT-demoted like everything else here — each measures a process-global quantity (500 Hz loop jitter, ZMQ round-trip latency, tracemalloc heap growth) rather than asserting a safety invariant, so on a box that also runs the robot and parallel agent sessions they are flake sources per-commit and only meaningful on the quiet 04:00 run. motor_guard's actual safety logic — every E-stop, NaN rejection, workspace-limit, staleness and interpolation-continuity test — is unmarked and stays per-commit. The boundary is 'measures the machine' vs 'asserts the contract', not 'lives in motion/'. A demotion may only land in the same commit as a live runner; without one, `nightly` is a delete button.",
    "hypothesis_deep: hypothesis tests benefiting from --hypothesis-profile=ci-deep. Currently UNUSED: the nightly runner raises the profile for the whole suite rather than per test, so nothing needs to opt in. Kept as reserved vocabulary for a test that wants deep exploration on a normal gate run.",
    # ros_ws/src/jugglebot/test/{test_flake8,test_pep257,test_copyright}.py carry
    # these. They are normally registered by the ament_* plugins, which the
    # addopts above disable, and ros_ws has no [tool:pytest] of its own — so a
    # `colcon test` or a `pytest ros_ws/...` walks up to THIS file and would turn
    # them into hard collection errors under --strict-markers. Registered so that
    # stays a no-op rather than a confusing failure.
    "linter: ament lint marker (ament_* plugins are disabled here)",
    "flake8: ament lint marker (ament_* plugins are disabled here)",
    "pep257: ament lint marker (ament_* plugins are disabled here)",
    "copyright: ament lint marker (ament_* plugins are disabled here)",
    "serial: must not run under xdist parallelism — the test measures a process-global resource (heap allocation, GC events, wall-clock) whose baseline is polluted by concurrent load or by unrelated tests sharing the interpreter. ./run_tests.sh runs these in a dedicated single-process phase after the parallel phase; a test carrying BOTH serial and nightly gets that phase only under `--full` (or the 04:00 run), never in the default gate. Add this ONLY for process-global measurement; a test that merely needs a port or a temp file does not qualify (use an ephemeral port / tmp_path instead).",
]

# On Jetson (ROS2 Foxy), the system launch_testing plugin is incompatible
# with pytest >=8.  If you see "consider_namespace_packages" errors, either:
#   pip3 install 'pytest<8'
# or set the environment variable to skip all setuptools plugin loading:
#   PYTEST_DISABLE_PLUGIN_REGISTRATION=1 python3 -m pytest -v
