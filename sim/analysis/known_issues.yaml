# Known failure patterns for hardware diagnosis.
#
# This file is a SIGNATURE CATALOG for automated detection by diagnose.py.
# Each entry defines machine-readable detection criteria that the /diagnose
# slash command matches against analysis results.
#
# For the full narrative (symptoms, discussion, fix, outcome), see the
# linked logbook entry.  This file stays lean and machine-focused.
#
# Fields:
#   id:            unique identifier (UPPER_SNAKE_CASE)
#   name:          short human-readable name
#   severity:      critical | high | medium | low
#   status:        One of:
#                    fixed      — resolved bug, kept for regression detection
#                    active     — ongoing issue, needs investigation or fix
#                    persistent — permanent hardware characteristic, not a bug
#                    known      — understood behaviour, no action needed
#   fixed_date:    ISO date when fixed (fixed status only)
#   logbook_entry: filename in logbook/ with the full investigation story
#   signatures:    list of detection criteria (type + thresholds)
#   fix:           brief remediation hint (details in logbook entry)
#   reference:     path to relevant code (optional)

version: 2

issues:
  # -----------------------------------------------------------------------
  # Fixed issues (kept for regression detection)
  # -----------------------------------------------------------------------

  - id: VEL_FF_BUG
    name: "Velocity feedforward semantic mismatch"
    severity: critical
    status: fixed
    fixed_date: "2026-03-30"
    logbook_entry: "2026-03-30-velocity-feedforward-oscillation.md"
    signatures:
      - type: oscillation
        chatter_threshold: 0.5
        amplitude_growing: true
    fix: "Use (cmd - prev_cmd)/dt for velocity feedforward."

  - id: COLD_HOLD_STROKE_MIN
    name: "Cold-hold fallback commanded stroke minimum"
    severity: critical
    status: fixed
    fixed_date: "2026-04-01"
    logbook_entry: "2026-04-01-cold-hold-fallback-stroke-minimum.md"
    signatures:
      - type: discontinuity
        field: cmd_ext
        threshold_mm: 100.0
      - type: solve_status_pattern
        pattern: "cold_hold"
    fix: "cold_hold now holds at q_cur when available."

  - id: ASSIGNMENT_ORDER
    name: "Assignment-order bug in feedforward computation"
    severity: critical
    status: fixed
    fixed_date: "2026-03-30"
    signatures:
      - type: discontinuity
        field: cmd_ext
        threshold_mm: 20.0
    fix: "Capture prev_cmd before overwriting cmd in the control loop."

  - id: CAN_LOSS_FAULT_INVERSION
    name: "CAN-loss fault response de-energised healthy holding actuators"
    severity: critical
    status: fixed
    fixed_date: "2026-05-19"
    logbook_entry: "2026-05-19-can-loss-fault-response-safety-inversion.md"
    description: >
      A blanket "control_mode==ERROR ⇒ stow+IDLE" fault response in
      can_node._sub_control_mode applied a single de-energising policy to a
      heterogeneous fault set.  On a transient CAN loss the leg ODrives stay
      CLOSED_LOOP and autonomously hold their last setpoint (safe while the
      bus is down), but the ERROR-mode stow commanded them IDLE on reconnect
      — collapsing an otherwise-stable pose.  Fixed by discriminating on
      actuator integrity (legs CLOSED_LOOP + error/disarm-free ⇒ hold) and
      deferring any genuine stow until the watchdog confirms the bus
      restored.  Pre-fix signature: legs current_state 8→1 within ~120 ms
      of control_mode→ERROR, ~1.8 s BEFORE FAULT→BOOT.
    signatures:
      - type: ros2_log_pattern
        pattern: "holding last setpoint|deferring stow until the bus is restored"
        level: ["ERROR"]
    fix: >
      Discriminating fault response with deferred-on-reconnect stow:
      can_node._fault_response / _actuators_intact_and_holding.
    reference: "ros_ws/src/jugglebot/jugglebot/can_node.py:_fault_response"

  # -----------------------------------------------------------------------
  # Active issues (need investigation or fix)
  # -----------------------------------------------------------------------

  - id: MPC_STALENESS
    name: "MPC solve time exceeding budget"
    severity: high
    status: active
    description: >
      MPC solver takes too long, causing the motor guard to receive stale
      commands.  At 40 Hz the budget is ~24ms.  3+ consecutive violations
      risk triggering the motor guard's staleness E-stop (200ms timeout).
    signatures:
      - type: solve_time
        max_consecutive_violations: 3
    fix: >
      Reduce horizon length, increase max_cpu_time, ensure warm-start is
      working, or check for thermal throttling on Jetson.
    reference: "controller/params.py"

  - id: MPC_OVERSHOOT_SATURATION
    name: "MPC NLP saturation when plant overshoots the ref"
    severity: medium
    status: fixed
    fixed_date: "2026-04-20"
    logbook_entry: "2026-04-20-k1-k6-reference-feasibility-resolution.md"
    description: >
      At move-start, when the plant is carrying residual motion or starts off
      the commanded initial pose, actual extension can lead cmd extension by
      10+ mm while the reference is still accelerating.  IPOPT is asked to
      unwind the overshoot against an accelerating ref within a 24 ms budget
      and bails out before completing one iteration (ipopt_iter==0), so the
      walk-forward fallback (commit 64742f2) freezes cmd and the plant holds
      until ref catches up.  Signature-wise this is distinct from generic
      MPC_STALENESS: consecutive timeouts PLUS an overshoot direction PLUS a
      still-moving ref.  Fix target is the ref source, not the solver —
      prepend a warm-up Hermite segment from (current plant pose, current
      twist) on move transitions so the NLP is never asked to reverse the
      plant against an accelerating ref.  Safety-wise benign with walk-forward
      fallback in place, but it creates a multi-hundred-ms tracking hole that
      matters for dynamic juggling.
    signatures:
      - type: overshoot_saturation
        zero_iter_run_min: 10
        ext_lead_mm: 10.0
    fix: >
      On each new move / target update, inject a synthetic ReferenceEvent at
      t=t_now carrying the current plant pose and twist. Clamp injected twist
      to ±v_max to guard against noisy FK-derived velocity. See controller/
      zmq_target.py and controller/target.py.
    reference: "controller/mpc.py"

  - id: PLANT_TELEMETRY_COLLAPSE
    name: "Plant telemetry collapse (motors lost torque, feedback frozen)"
    severity: high
    status: active
    logbook_entry: "2026-04-18-move5-overshoot-stall-and-plant-collapse.md"
    description: >
      A two-phase signature: (1) >=5 legs show abs(leg_vel) > 1.5*v_max in the
      same sample — uncommanded motion consistent with motors unarming and
      legs free-falling under platform weight; followed within ~500 ms by
      (2) a run of >=20 consecutive samples where every actual_ext_i reads
      exactly 0.0 — the stale/empty-payload sentinel the HardwarePlant ZMQ
      SUB hands back when the feedback publisher dies.

      Upstream cause is exogenous to the MPC: the operator Ctrl+C'd the
      ROS2 launch (motor_guard dies, legs fall, mpc_bridge_node dies), or
      the CAN bus dropped, or a power-supply fault.  The HardwarePlant
      telemetry-staleness E-stop (commit 17a239c) does NOT currently halt
      run_mpc.py — it only publishes a ZMQ mode message — so the MPC
      process keeps writing CSV rows against zero-sentinel feedback for
      whatever remains of its duration, producing a ghost solve-loop.

      When detected, diagnose.py truncates aggregate metrics (tracking,
      solve_times, workspace, steady_state, etc.) to the pre-collapse slice
      and downgrades downstream flags to info.  Without this, post-collapse
      noise dominates the session metrics and healthy runs can be
      misclassified as FAIL (see logbook entry for the Move 5 case).
    signatures:
      - type: plant_collapse
        vmax_ratio: 1.5
        legs_min: 5
        zero_run_min: 20
        window_s: 0.5
    fix: >
      Fix is runtime-side, not analysis-side. Add an estop_requested flag on
      HardwarePlant (flipped inside estop()) and make run_mpc.py / runner.py
      break their loop cleanly when it's set. Also detect persistent stale
      contents (telemetry fresh-looking but unchanging) as a separate trigger
      for estop. See Bundle B in logbook entry.
    reference: "controller/hardware_plant.py"

  - id: LEG2_TRACKING
    name: "Leg 2 consistently worst tracker"
    severity: medium
    status: active
    description: >
      Leg 2 consistently has the highest tracking error across all test
      sessions.  Likely a mechanical issue (cable routing, coupler play,
      or friction).
    signatures:
      - type: per_leg_tracking
        leg: 2
        rms_ratio_vs_median: 1.5
    fix: >
      Inspect leg 2 mechanical assembly: check coupler backlash, cable
      routing interference, and bearing friction.
    reference: "tests/hardware/free_platform_test.py"

  # -----------------------------------------------------------------------
  # Persistent hardware characteristics (not bugs, but worth flagging)
  # -----------------------------------------------------------------------

  - id: CAN_BUS_WATCHDOG
    name: "CAN bus watchdog restore"
    severity: high
    status: persistent
    description: >
      The CAN bus was lost and restored by the watchdog timer.  During the
      outage, motor commands were not delivered.  Can cause tracking
      divergence or E-stop if outage exceeds 150ms.
    signatures:
      - type: ros2_log_pattern
        pattern: "CAN bus restored by watchdog"
        level: ["ERROR", "WARN"]
    fix: >
      Check CAN bus wiring, termination resistors, and EMI shielding.

  - id: ODRIVE_DISARM
    name: "ODrive axis disarmed in CLOSED_LOOP"
    severity: critical
    status: persistent
    description: >
      An ODrive motor controller disarmed while in closed-loop control.
      Causes immediate loss of motor torque on the affected axis.
    signatures:
      - type: ros2_log_pattern
        pattern: "Axis disarmed while in CLOSED_LOOP"
        level: ["ERROR"]
    fix: >
      Check disarm reason in the log.  Common: overcurrent, overvoltage,
      encoder error, motor overtemp.

  - id: BOOT_TIMEOUT
    name: "Boot timeout — no ODrive heartbeats"
    severity: high
    status: persistent
    description: >
      The orchestrator did not receive heartbeats from ODrive controllers
      within the 30-second boot timeout.
    signatures:
      - type: ros2_log_pattern
        pattern: "Boot timeout: no ODrive heartbeats"
        level: ["ERROR"]
    fix: >
      Check power supply, CAN bus connections, ODrive firmware, and
      termination (120 ohm at each end).

  - id: MOTOR_FEEDBACK_STALE
    name: "Motor feedback stale"
    severity: medium
    status: persistent
    description: >
      Motor guard did not receive motor feedback for longer than 150ms.
      Commands suppressed until feedback resumes.
    signatures:
      - type: ros2_log_pattern
        pattern: "motor feedback stale|Motor FB stale"
        level: ["WARN", "ERROR"]
    fix: >
      Check CAN bus throughput — may indicate congestion or dropped frames.

  - id: CAN_STEP_REJECT
    name: "CAN node leg command rejected"
    severity: critical
    status: persistent
    description: >
      CAN node rejected a leg command because at least one leg would step
      more than 0.2 rev from current position.  Last-resort safety check.
    signatures:
      - type: ros2_log_pattern
        pattern: "Leg command REJECTED"
        level: ["ERROR"]
    fix: >
      Investigate large step source: unit mismatch, stale command after
      mode transition, or MPC solver divergence.

  - id: FIRMWARE_MISMATCH
    name: "ODrive firmware version mismatch"
    severity: high
    status: persistent
    description: >
      One or more ODrive controllers have unexpected firmware versions.
      Protocol differences could cause encoding bugs.
    signatures:
      - type: ros2_log_pattern
        pattern: "firmware.*mismatch|firmware check FAILED"
        level: ["ERROR", "WARN"]
    fix: >
      Flash all ODrive controllers to expected firmware version.
      See config/protocol_config.yaml.

  # -----------------------------------------------------------------------
  # Known behaviour (expected, no action needed)
  # -----------------------------------------------------------------------

  - id: PILOT_ESTOP
    name: "Pilot E-stop button pressed"
    severity: low   # severity of the EVENT itself — it is a normal safe stop
    status: known
    description: >
      The physical E-stop button was pressed.  This cuts power to the ODrive
      DC bus, which immediately causes DC_BUS_UNDER_VOLTAGE (error 512) on
      every powered motor, and triggers an orchestrator FAULT within a few
      hundred milliseconds.

      The E-stop is ALWAYS a pilot intervention — it is a RESPONSE to
      concerning behaviour, never a primary cause.  When diagnose.py detects
      this signature it emits an `estop_event` info flag and tags all
      downstream events (STOW-drop discontinuities, motor disarms, tracking
      blowups, FAULT transition, control mode → ERROR) as `post_estop: true`
      with severity downgraded to `info`.
    signatures:
      - type: motor_error_cascade
        error_code: 512    # ERR_DC_BUS_UNDER_VOLTAGE
        affected_motors_min: 2
        cascade_window_ms: 200
      - type: orchestrator_fault_after_motor_error
        within_ms: 500
    fix: >
      Not a fault — expected behaviour.  Investigate the PRE-E-stop MPC /
      plant behaviour; that is the real failure that prompted the operator
      to intervene.  Do NOT flag the E-stop, STOW-drop, or cascading motor
      errors as independent issues.
    reference: "sim/analysis/diagnose.py:detect_estop_event"

  - id: TIMING_FIRST_SAMPLE
    name: "First-sample cold-start solve spike"
    severity: low
    status: known
    description: >
      The first MPC solve is always slower due to CasADi JIT compilation
      and IPOPT warm-start initialisation.  Expected behaviour.
    signatures:
      - type: solve_time_spike
        sample_index: 0
        threshold_ms: 15.0
    fix: "Expected behaviour.  No action needed unless it exceeds ~50ms."
