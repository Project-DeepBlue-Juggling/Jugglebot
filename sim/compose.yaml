services:
  sim:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/tmp}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix          # X11 display (Linux)
      - ./logs:/app/logs                        # Persist telemetry logs
      - ..:/repo:ro                             # Mount repo root for motion/ imports
    # Uncomment and adjust for SpaceMouse USB passthrough:
    # devices:
    #   - /dev/hidraw0:/dev/hidraw0
    command: python3 main.py

  test:
    build: .
    volumes:
      - ..:/repo:ro
    environment:
      - MUJOCO_GL=osmesa                        # Headless rendering for tests
    command: python3 -m pytest tests/ -v
