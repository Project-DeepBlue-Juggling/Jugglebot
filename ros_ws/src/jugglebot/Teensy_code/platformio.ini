; PlatformIO project — Jugglebot PLATFORM Teensy 4.0 firmware
;
; ⚠ THIS IS A COMPILE GATE, NOT A FLASH PATH. ⚠
;
;   pio run                 compile + link the whole sketch  ← the reason this file exists
;   pio run -t clean        drop the build tree
;   pio device monitor      serial monitor @ 115200
;
; There is DELIBERATELY no `upload_command`, unlike the two sibling sketches
; (Teensy_code_canbridge/, CatchingCone_code/). Flash this board from the Arduino
; IDE, exactly as every previous flash of it has been done. Two concrete reasons:
;
;   1. The binary this file produces is NOT the binary the board has been running.
;      Linking the sketch's std::vector under PlatformIO's toolchain needs
;      -fno-exceptions/-fno-rtti/-fno-unwind-tables AND a patched linker script
;      (extra_script.py) to get the bare .ARM.extab section into range of its
;      R_ARM_PREL31 relocation. Those are safe, but they are a DIFFERENT image
;      from an Arduino IDE build, and nothing has validated one on this hardware.
;      Switching the flash toolchain in the same sitting that validates the
;      velocity-continuous makeSmoothMove would confound the two changes: a
;      misbehaving § CHECK HAND-4 could then be Phase 4 *or* the toolchain, with
;      no way to tell them apart. Switch deliberately, on its own, with its own
;      powered re-validation.
;   2. Without `upload_command`, `pio run -t upload` falls back to PlatformIO's
;      bundled teensy_post_compile / teensy_reboot, which are glibc-2.34 binaries
;      that CANNOT RUN on this Jetson (Ubuntu 20.04, glibc 2.31). So the compile
;      gate physically cannot flash the board by accident — a property worth
;      keeping while /dev/ttyACM0 is the live Platform Teensy.
;
; WHY A COMPILE GATE AT ALL. Until 2026-07-27 nothing in the repository compiled
; this sketch. tests/firmware/test_hand_smooth_move_xref.py host-compiles
; Trajectory.h with g++, which is real coverage but only of that one header — the
; .ino itself, against the actual Teensy 4.0 toolchain, FlexCAN_T4, SCL3300 and
; the GENERATED hardware_config.h/protocol_config.h, was never built anywhere
; except on the operator's laptop at flash time. A syntax or type error in a
; firmware rewrite (Phase 4 rewrote makeSmoothMove; this phase touched the .ino)
; therefore surfaced first at the bench, with the robot powered. `pio run` moves
; that discovery to the desk, in ~10 s.
;
; The .ino, Trajectory.h and the generated protocol_config.h / hardware_config.h
; all live in this directory, so src_dir is '.'. Re-run
; `python config/generate_config.py` after any config change, then rebuild.

[platformio]
src_dir = .

[env:teensy40]
; PINNED, for the same reason the can-bridge pins: a floating `platform = teensy`
; silently pulls a newer toolchain on the next `pio run`, so "it compiled" would
; stop meaning "it compiled the way it compiled last time".
platform = teensy@5.1.0
board = teensy40          ; Teensy 4.0 — this is the PLATFORM board, not the 4.1 can-bridge
framework = arduino
monitor_speed = 115200

; Build flags — the canbridge set, minus its FreeRTOS-specific parts.
; -fno-exceptions / -fno-rtti / -fno-unwind-tables /
; -fno-asynchronous-unwind-tables: the sketch uses std::vector (packedMsgs /
; sendUs), whose out-of-line growth path references std::__throw_length_error and
; so drags libstdc++'s exception machinery — and with it libgcc's pr-support.o —
; into the link. The firmware does not throw; disabling EH is correct and saves
; flash. These alone are NOT sufficient (see extra_script.py).
build_flags =
    -O2
    -DUSB_SERIAL
    -Wall
    -Wformat=1
    -fno-exceptions
    -fno-rtti
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables

; Post-SConscript script: (a) shims PlatformIO's glibc-2.34 `teensy_size` with the
; toolchain's arm-none-eabi-size, and (b) patches the stock Teensy 4.0 linker
; script so the bare `.ARM.extab` section from libgcc's pr-support.o lands in
; range of its R_ARM_PREL31 relocation. Same two workarounds the sibling sketches
; use; see extra_script.py for the full diagnosis.
extra_scripts = extra_script.py

; SCL3300 inclinometer (Murata, SPI) — the only external library. FlexCAN_T4 and
; SPI ship bundled with PlatformIO's Teensy package. PINNED for the same
; reproducibility reason as `platform` above.
lib_deps = davidarmstrong/SCL3300@3.3.1
