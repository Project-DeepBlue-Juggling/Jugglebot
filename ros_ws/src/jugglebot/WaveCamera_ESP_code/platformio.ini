; PlatformIO project configuration
; Wave GPIO explorer: ESP32-WROOM-32D DevKitC (CP210x USB-UART bridge).
; See ros_ws/docs/wave_camera_gpio_explorer.md for the design, README.md for wiring and commands.

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include
test_dir = test

; ---------------------------------------------------------------------------
; Firmware. Plain ESP32: Serial is UART0 through the CP210x, no USB-CDC.
; WiFi and Bluetooth are never started (nothing includes WiFi.h / BT APIs).
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; COM5 on this machine; the number may change if the board is re-plugged
; into a different USB port. tools/wave_console.py auto-detects 10C4:EA60.
upload_port = COM5
upload_speed = 921600
monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_unflags = -std=gnu++11
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -std=gnu++17

; ---------------------------------------------------------------------------
; Host-side Unity tests for the header-only pure logic (QX packet builder,
; pin classifier, pulse/period statistics, blocked-word filter, event ring,
; CAN frame codecs, record state machine, 0x7DD time slave) and a lint that
; only the allowed modules call gpi2_drive::request_*.
; Nothing under src/ that touches Arduino.h is compiled here.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -I include
    -I src
    -D UNIT_TEST
    -D UNITY_INCLUDE_DOUBLE
