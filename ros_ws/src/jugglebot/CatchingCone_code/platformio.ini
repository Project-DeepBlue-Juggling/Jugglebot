; PlatformIO project — Jugglebot catching cone firmware
;
; Build / upload / monitor:
;   pio run                 compile
;   pio run -t upload       flash the Teensy
;   pio device monitor      serial monitor @ 115200
;
; The .ino sketch and the generated protocol_config.h / hardware_config.h all
; live in this directory, so src_dir is '.'. Re-run
; `python config/generate_config.py` after any config change, then rebuild.

[platformio]
src_dir = .

[env:teensy40]
platform = teensy
board = teensy40          ; change to teensy41 for a Teensy 4.1
framework = arduino
monitor_speed = 115200

; Jetson-host build/flash support (same workarounds as Teensy_code_canbridge):
; PlatformIO's bundled teensy_size / teensy_reboot are glibc-2.34 binaries that
; won't run on Ubuntu 20.04 (glibc 2.31). extra_script.py shims teensy_size;
; upload calls the locally-built PJRC teensy_loader_cli directly.
;
; !! Two-Teensy hazard: the loader's `-s` soft reboot targets the FIRST Teensy
; serial device it finds — with both the can-bridge AND the cone on USB it can
; reboot+flash the WRONG one (this happened on 2026-06-10). With multiple
; Teensys attached, do NOT rely on -s: put the intended Teensy into its
; bootloader yourself (open its specific /dev/ttyACMx at 134 baud, or press
; its button) and let the waiting loader catch it:
;   python3 -c "import serial,time; s=serial.Serial('/dev/ttyACM<N>',134); time.sleep(0.5); s.close()"
;   /home/jetson/tools/teensy_loader_cli/teensy_loader_cli --mcu=TEENSY40 -w -v .pio/build/teensy40/firmware.hex
extra_scripts = extra_script.py
upload_command = /home/jetson/tools/teensy_loader_cli/teensy_loader_cli --mcu=TEENSY40 -w -s -v $SOURCE

; FlexCAN_T4 ships bundled with PlatformIO's Teensy package — no lib_deps
; needed. If an older Teensy package lacks it, uncomment:
; lib_deps = https://github.com/tonton81/FlexCAN_T4.git
