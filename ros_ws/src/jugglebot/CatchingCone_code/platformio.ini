; PlatformIO project — Jugglebot catching cone firmware
;
; Build / upload / monitor:
;   pio run                 compile
;   pio run -t upload       flash the Teensy
;   pio device monitor      serial monitor @ 115200
;
; The .ino sketch and the generated protocol_config.h / hardware_config.h all
; live in this directory, so src_dir is '.'. Re-run
; `python config/generate_config.py` after any config change, then rebuild.

[platformio]
src_dir = .

[env:teensy40]
platform = teensy
board = teensy40          ; change to teensy41 for a Teensy 4.1
framework = arduino
monitor_speed = 115200

; FlexCAN_T4 ships bundled with PlatformIO's Teensy package — no lib_deps
; needed. If an older Teensy package lacks it, uncomment:
; lib_deps = https://github.com/tonton81/FlexCAN_T4.git
