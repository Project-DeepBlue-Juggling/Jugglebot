; PlatformIO project — Jugglebot PLATFORM Teensy 4.0 firmware
;
;   pio run                 compile + link the whole sketch
;   pio run -t upload       build + flash (see the TWO-TEENSY PROCEDURE below)
;   pio run -t clean        drop the build tree
;   pio device monitor      serial monitor @ 115200
;
; FLASH PATH (since 2026-07-31). This file was deliberately a compile-gate-only
; for its first days: the pio image (exception flags + patched linker script,
; see extra_script.py) was a DIFFERENT binary from the Arduino IDE builds the
; board had always run, and switching flash toolchains mid-validation would
; have confounded firmware changes with toolchain changes. That discipline paid
; off during the 2026-07-31 CAN3 investigation (the V1 rollback stayed a clean
; A/B on the code delta alone). The switch to pio flashing was then made
; deliberately, on its own, per that file's own instruction.
;
; FLASH PATH SINCE 2026-09-09: OVER CAN, from this build tree, in one call:
;
;   pio run -e teensy40 -t upload
;
; builds firmware.hex and hands it to tools/teensy_link_bridge.py --fw-update,
; which streams it through the can-bridge's typed relay (0x6F0/0x6F1) into
; the FwUpdate receiver in the sketch (FW >= 5). The board's micro-USB port
; is dead, so this is the ONLY flash path. Run it with the ROS launch DOWN
; (the bridge is a single-owner UDP link and the tool needs it) and the
; setpoint output disarmed (the bridge refuses the update ops while armed).
; The receipt is the STATE_READ version the tool prints before and after
; (5 -> 6 for the first Jetson-built image); the boot banner is not
; visible any more. To rehearse without touching the program region:
;   $PYTHONEXE ../../../../tools/teensy_link_bridge.py \
;       --fw-update .pio/build/teensy40/firmware.hex --verify-only
; A Platform reboot resets its cold-start state, so the next launch homes all
; seven axes.
;
; History: pio uploads were SUSPENDED 2026-07-31 after the first pio-built
; image was CAN-mute on the hardware (the board enumerated as a "Teensy 4.1").
; Owner's call 2026-09-09: circumstantial, not a property of this build —
; the resolved defines are -D__IMXRT1062__ -DARDUINO_TEENSY40 TEENSYDUINO=160
; on core 1.160.0 with gcc 11.3.1, i.e. the IDE's own recipe. The pinned
; serial USB machinery (upload_platform.sh) is kept for the record only.
;
; WHY A COMPILE GATE AT ALL. Until 2026-07-27 nothing in the repository compiled
; this sketch: the .ino, against the actual Teensy 4.0 toolchain, FlexCAN_T4,
; SCL3300 and the GENERATED hardware_config.h/protocol_config.h, was never built
; anywhere except on the operator's laptop at flash time. A syntax or type error
; in a firmware rewrite therefore surfaced first at the bench, with the robot
; powered. `pio run` moves that discovery to the desk, in ~10 s. (Until
; skill-stack R1 a second gate, tests/firmware/test_hand_smooth_move_xref.py,
; host-compiled Trajectory.h with g++; that header and its xref died with the
; stroke engine at FW 7.)
;
; The .ino and the generated protocol_config.h / hardware_config.h
; all live in this directory, so src_dir is '.'. Re-run
; `python config/generate_config.py` after any config change, then rebuild.

[platformio]
src_dir = .

[env:teensy40]
; PINNED, for the same reason the can-bridge pins: a floating `platform = teensy`
; silently pulls a newer toolchain on the next `pio run`, so "it compiled" would
; stop meaning "it compiled the way it compiled last time".
platform = teensy@5.1.0
board = teensy40          ; Teensy 4.0 — this is the PLATFORM board, not the 4.1 can-bridge
framework = arduino
monitor_speed = 115200
; Upload = the over-CAN firmware update (see the header). $SOURCE is the
; built firmware.hex; $PYTHONEXE is the interpreter running pio (the project
; venv, which has the tool's dependencies). The USB path
; (`bash upload_platform.sh $SOURCE`) is history: the port is dead.
upload_protocol = custom
upload_command = $PYTHONEXE "$PROJECT_DIR/../../../../tools/teensy_link_bridge.py" --fw-update $SOURCE

; Build flags — the canbridge set, minus its FreeRTOS-specific parts.
; -fno-exceptions / -fno-rtti / -fno-unwind-tables /
; -fno-asynchronous-unwind-tables: the sketch uses std::vector (packedMsgs /
; sendUs), whose out-of-line growth path references std::__throw_length_error and
; so drags libstdc++'s exception machinery — and with it libgcc's pr-support.o —
; into the link. The firmware does not throw; disabling EH is correct and saves
; flash. These alone are NOT sufficient (see extra_script.py).
build_flags =
    -O2
    -DUSB_SERIAL
    -Wall
    -Wformat=1
    -fno-exceptions
    -fno-rtti
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables

; Post-SConscript script: (a) shims PlatformIO's glibc-2.34 `teensy_size` with the
; toolchain's arm-none-eabi-size, and (b) patches the stock Teensy 4.0 linker
; script so the bare `.ARM.extab` section from libgcc's pr-support.o lands in
; range of its R_ARM_PREL31 relocation. Same two workarounds the sibling sketches
; use; see extra_script.py for the full diagnosis.
extra_scripts = extra_script.py

; SCL3300 inclinometer (Murata, SPI) — the only external library. FlexCAN_T4 and
; SPI ship bundled with PlatformIO's Teensy package. PINNED for the same
; reproducibility reason as `platform` above.
lib_deps = davidarmstrong/SCL3300@3.3.1
