; PlatformIO project — Jugglebot can-bridge Teensy 4.1 firmware
;
; Build / upload / monitor:
;   pio run                 compile
;   pio run -t upload       flash the Teensy (Teensy must be plugged in via USB)
;   pio device monitor      serial monitor @ 115200 (USB CDC debug console only)
;
; The .ino sketch, hand-authored C++ modules, and generated headers all live
; in this directory, so src_dir is '.'. Re-run the codegen after any change:
;   python config/generate_config.py
;   python config/generate_udp_protocol.py
; then rebuild.
;
; Hardware: Teensy 4.1 + PJRC Ethernet Kit (DP83825I PHY).
; CPU 600 MHz, Optimize Faster (-O2), USB type Serial (CDC for debug only —
; the data path is point-to-point UDP over Ethernet to the Jetson).

[platformio]
src_dir = .

[env:teensy41]
; Stock PlatformIO Teensy platform. (The tsandmann/platform-teensy fork that
; matches the freertos-teensy library's blink example wants a custom
; arm-cortexm7f-eabi-g++ toolchain that isn't bundled here; staying on stock.)
; PINNED to the version the flashed firmware was built against — a floating `platform = teensy` would silently pull a newer toolchain on
; the next `pio run` and change the binary out from under a validated flash.
; Bump deliberately (and re-run the powered re-validation) when upgrading.
platform = teensy@5.1.0
board = teensy41
framework = arduino
monitor_speed = 115200

; Upload via the system's `teensy_loader_cli` directly. PlatformIO's bundled
; teensy_post_compile (teensy-gui) AND teensy_reboot (teensy-cli) are both
; built against glibc 2.34, which the Jetson's Ubuntu 20.04 (glibc 2.31)
; cannot run. So we bypass PlatformIO's upload-protocol wrappers entirely
; and call the apt-installed loader directly.
;
; `-s` soft-reboots the running firmware into the bootloader over USB, so a
; flash needs NO physical button press (the Teensy must currently enumerate as a
; Teensyduino Serial device — `lsusb | grep 16c0` shows 16c0:0483). `-w` is kept
; as the manual fallback: if the soft reboot can't reach the firmware (e.g. a
; hung build that never enumerated), the loader waits for a button press instead.
; This is the headless-Jetson path — PlatformIO's own teensy_reboot helper is
; glibc-2.34 and won't run here (see upload_command note above). `-v` is verbose
; progress; `--mcu=TEENSY41` is the board target.
; NB: close `pio device monitor` before flashing — it holds /dev/ttyACM0.
; Note: Ubuntu 20.04's apt-packaged teensy_loader_cli (at /usr/bin) is
; pre-Teensy-4.x — only knows MCUs up to TEENSY36. Build the upstream
; PJRC version locally and reference it here:
;   mkdir -p ~/tools && cd ~/tools && \
;     git clone https://github.com/PaulStoffregen/teensy_loader_cli.git && \
;     cd teensy_loader_cli && make
upload_command = /home/jetson/tools/teensy_loader_cli/teensy_loader_cli --mcu=TEENSY41 -w -s -v $SOURCE

; Post-SConscript script: patches the Teensy 4.1 linker script to capture
; bare .ARM.extab sections from libgcc's pr-support.o (pulled in via
; freertos-teensy's std::thread support) — see extra_script.py header for
; the full diagnosis. The original linker script under ~/.platformio is
; never modified. No-prefix means the script runs AFTER the platform builder
; sets LDSCRIPT_PATH (a `pre:` script runs before that and can't override it).
extra_scripts = extra_script.py

; Build flags. The 500 Hz interp ISR wants the cycles, so -O2.
;
; -fno-exceptions / -fno-rtti: keep libgcc's ARM exception unwind tables out
; of the link. Without this, std::thread support pulled in by freertos-teensy
; drags in pr-support.o whose .ARM.exidx entries overflow the R_ARM_PREL31
; relocation. The firmware does not throw, so disabling EH is correct AND
; saves substantial flash.
;
; -fno-unwind-tables / -fno-asynchronous-unwind-tables: strip any unwind
; tables the compiler might still emit, defence-in-depth against the same
; relocation overflow.
build_flags =
    -O2
    -DUSB_SERIAL
    -Wall
    -Wformat=1
    -fno-exceptions
    -fno-rtti
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables

; Library dependencies. FlexCAN_T4 is bundled with PlatformIO's Teensy
; package — no entry needed for it.
;
; FreeRTOS port: tsandmann/freertos-teensy (the originally-cited greiman fork
; is 404 as of 2026-06-02). Umbrella header is <arduino_freertos.h> (see
; freertos_shim.h). The standard FreeRTOS C API is unchanged across forks.
;
; QNEthernet is ssilverman's lwIP-backed Ethernet stack — supersedes the
; older NativeEthernet. Required for the PJRC Ethernet kit.
;
; PINNED to the exact versions the flashed firmware was built against. A floating git URL / bare version resolves to whatever HEAD /
; latest is at the next `pio run`, so an unpinned build is NOT reproducible and a
; library change could alter behaviour under a validated flash without any local
; edit. freertos-teensy is pinned by commit (its library.json version is 11.2.0-3);
; QNEthernet by its published version. Bump deliberately + re-validate on upgrade.
lib_deps =
    https://github.com/tsandmann/freertos-teensy.git#7e6ae6a4956ce8069b7661ffe75e9d70c9a37bbe
    ssilverman/QNEthernet@0.35.0
