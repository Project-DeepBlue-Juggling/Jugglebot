<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugglebot</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/viewer.css">
    <link rel="stylesheet" href="css/panels.css">
    <link rel="stylesheet" href="css/charts.css">

    <!-- uPlot charting library (vendored locally, not ES module) -->
    <link rel="stylesheet" href="lib/uPlot.min.css">
    <script src="lib/uPlot.iife.min.js"></script>

    <!-- ROSLIB (global, not an ES module) -->
    <script src="lib/roslib.min.js"></script>

    <!-- Import maps for ES modules (no build step) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <!-- Left: topic monitor sidebar -->
        <div id="left-sidebar">
            <div class="panel" id="panel-topics">
                <div class="panel-header">
                    <span class="panel-title">Topics</span>
                    <span class="topic-window-label" id="topic-window-label">5s window</span>
                </div>
                <div id="topic-table-container"></div>
            </div>
        </div>

        <!-- Draggable resize handle between left sidebar and viewer -->
        <div id="left-resize-handle"></div>

        <!-- Centre: 3D viewer with overlays -->
        <div id="viewer-pane">
            <div id="viewer-container"></div>

            <!-- Connection status indicator -->
            <div id="connection-status">
                <span class="status-dot disconnected" id="conn-dot"></span>
                <span id="conn-text">Disconnected</span>
            </div>

            <!-- Scene visibility menu -->
            <div id="scene-menu">
                <button id="scene-menu-toggle">View</button>
                <div id="scene-menu-dropdown"></div>
            </div>

            <!-- Command buttons -->
            <div id="command-overlay"></div>
        </div>

        <!-- Draggable resize handle between viewer and sidebar -->
        <div id="resize-handle"></div>

        <!-- Right: status sidebar -->
        <div id="sidebar">
            <!-- Sidebar toolbar: font size control -->
            <div id="sidebar-toolbar">
                <button class="font-btn" id="font-decrease" title="Decrease font size">A&#x2212;</button>
                <span class="font-size-label" id="font-size-label">14px</span>
                <button class="font-btn" id="font-increase" title="Increase font size">A+</button>
            </div>

            <!-- Orchestrator State + Bus Voltage -->
            <div class="panel panel-compact" id="panel-orchestrator">
                <div class="panel-header">
                    <span class="panel-title">State</span>
                    <span class="badge state-badge boot" id="state-badge">BOOT</span>
                    <span class="bus-voltage-inline">
                        <span class="value" id="bus-voltage-value">--</span>
                        <span class="unit">V</span>
                    </span>
                </div>
                <div class="sub-mode" id="state-sub-mode"></div>
            </div>

            <!-- System Flags -->
            <div class="panel" id="panel-flags">
                <div class="panel-header">
                    <span class="panel-title">System</span>
                </div>
                <div class="flags-grid" id="flags-grid"></div>
            </div>

            <!-- Levelling -->
            <div class="panel panel-compact" id="panel-levelling">
                <div class="panel-header">
                    <span class="panel-title">Levelling</span>
                    <div class="level-inline" id="level-content">
                        <span class="level-inline-item" title="Roll (X)"><span class="level-inline-label">X:</span><span class="level-inline-value" id="level-roll">--</span></span>
                        <span class="level-inline-item" title="Pitch (Y)"><span class="level-inline-label">Y:</span><span class="level-inline-value" id="level-pitch">--</span></span>
                    </div>
                    <span class="badge level-badge level-pending" id="level-status-badge">Not Levelled</span>
                </div>
            </div>

            <!-- Ball Butler -->
            <div class="panel" id="panel-bb">
                <div class="panel-header">
                    <span class="panel-title">Ball Butler</span>
                    <span class="badge" id="bb-state-badge">Disconnected</span>
                </div>
                <div id="bb-content"></div>
            </div>

            <!-- CAN Traffic -->
            <div class="panel" id="panel-can">
                <div class="panel-header">
                    <span class="panel-title">CAN Traffic</span>
                </div>
                <div class="can-rate">
                    <span class="value" id="can-rate-value">--</span>
                    <span class="unit">msg/s</span>
                </div>
                <canvas id="can-sparkline"></canvas>
            </div>

            <!-- Tracking Error -->
            <div class="panel" id="panel-tracking">
                <div class="panel-header">
                    <span class="panel-title">Tracking Error</span>
                </div>
                <div class="tracking-grid" id="tracking-grid"></div>
            </div>

        </div>

        <!-- Horizontal resize handle for chart panel -->
        <div id="chart-resize-handle">
            <span id="chart-toggle-label">Charts</span>
            <span id="chart-toggle-chevron">&#x25BC;</span>
        </div>

        <!-- Bottom: telemetry chart panel -->
        <div id="chart-panel">
            <!-- Signal toggle toolbar -->
            <div id="chart-toolbar">
                <div id="signal-toggles"></div>
                <div id="chart-time-window">
                    <label>Window:</label>
                    <select id="chart-window-select">
                        <option value="5">5s</option>
                        <option value="10" selected>10s</option>
                        <option value="30">30s</option>
                        <option value="60">60s</option>
                    </select>
                </div>
            </div>
            <!-- 3x3 chart grid -->
            <div id="chart-grid">
                <div class="chart-cell" id="chart-0"></div>
                <div class="chart-cell" id="chart-3"></div>
                <div class="chart-cell" id="chart-6"></div>
                <div class="chart-cell" id="chart-1"></div>
                <div class="chart-cell" id="chart-4"></div>
                <div class="chart-cell" id="chart-7"></div>
                <div class="chart-cell" id="chart-2"></div>
                <div class="chart-cell" id="chart-5"></div>
                <div class="chart-cell" id="chart-8"></div>
            </div>
        </div>
    </div>

    <!-- Entry point -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
