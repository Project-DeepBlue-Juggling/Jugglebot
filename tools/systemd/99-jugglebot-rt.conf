# JB-95: real-time priority ceiling for the jetson user (pam_limits).
#
# The CATCH solver worker asks for SCHED_FIFO priority 10. Ceiling 40 keeps every
# jetson process BELOW the kernel's threaded IRQ handlers and watchdogd (all FIFO
# 50) and migration/* (FIFO 99), so I/O completions and the watchdog always
# preempt user code. The worker itself asks for 10, not 40.
#
# This is only half the recipe: on this kernel (CONFIG_RT_GROUP_SCHED=y) the
# user.slice cpu cgroup also needs an RT budget, see jugglebot-rt-budget.service.
# Takes effect when the lingering systemd user manager restarts (reboot).
# Install: tools/systemd/README.md, section "Real-time budget for the solver worker".
jetson  -  rtprio  40
