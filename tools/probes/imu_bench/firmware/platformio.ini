; Bench PoC: Teensy 4.0 + ICM-42688-P over I2C (Wire, SDA=18 SCL=19), USB serial out.
;   pio run                 compile
;   pio run -t upload       flash over the Teensy's own micro-USB (this is a STANDALONE
;                           bench board, not the robot's Platform Teensy)
; Style follows ros_ws/src/jugglebot/Teensy_code_platform/platformio.ini (pinned platform).
[env:teensy40]
platform = teensy@5.1.0
board = teensy40
framework = arduino
monitor_speed = 115200
build_flags =
    -O2
    -DUSB_SERIAL
    -Wall
