        text: "Juggle panel: Columns, Sep. 125, Apex 0.95, Dwell 0.27, Throws 21. Five Attempts, more if you have time: the fault is rare (about once in 50 to 400 launches), so a Sitting with no fault is the likely outcome. FEAT-49 names the Apex 0.95 to 1.35 rows; only Apex 0.95 is on this sheet. Before each Attempt: Cup empty, Ball Butler loaded."
    see: Attempts fly as in step 8 with the capture running. The capture stays armed.
    stop_if: A Hand SPINOUT - stop at the first one after the capture saves. The Hand or the stream behaves differently with the capture running (new STOPs, a jerky Hand) - Ctrl-C the capture and note it. Any Leg base joint moves (stop the sheet there, stand down and tell a Session).
    record: "The capture path if one saved, the launch log line of any SPINOUT, the number of launches flown with it armed (1), any clean-stop save or timeout. Type pending: with no fault there is no window to judge."
    serves:
      - item: FEAT-49
        do: [1, 2]
        pass: true

  - n: 49
    kind: run
    title: Ride-along check, STOP records and LANE_REFUSED ends across today's launches
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        command: grep -nE "LANE_REFUSED|firmware scheduler STOP|firmware STOP record|setpoint drain dropped" ~/Desktop/Jugglebot/temp/logs/launch_2026-11-18_1.log ~/Desktop/Jugglebot/temp/logs/launch_2026-11-18_2.log ~/Desktop/Jugglebot/temp/logs/launch_2026-11-18_3.log ~/Desktop/Jugglebot/temp/logs/launch_2026-11-18_4.log
    see: Every firmware scheduler STOP line is followed by its firmware STOP record line carrying a classification, and since 2026-11-13 a clause saying whether a knot was dropped. No output at all means no STOP, no drop and no LANE_REFUSED end today. A 'No such file' line for a launch you skipped is fine.
    stop_if: Nothing here stops the Sitting.
    record: "BUG-58: the log path and the line of each LANE_REFUSED end (none = say so). Type pending: the GC_PROBE lines around a LANE_REFUSED end are read at the debrief."
    serves:
      - item: BUG-58
        pass: true

  - n: 50
    kind: restore
    title: Stand down launch 4 and see what the capture does on a clean stop
    from: [launched, level, armed, bb-fed]
    to: []
    actions:
      - where: GUI
        text: "State minimap: hold IDLE to confirm."
      - where: Terminal 3
        text: Read what the capture printed when the Hand went Idle, then Ctrl-C it.
      - where: Terminal 1
        text: Ctrl-C the launch and wait for the shell prompt.
      - where: Hands
        text: Empty the Cup. Unplug the Hand's USB if you do not leave it connected.
    see: On the clean Idle the capture re-arms and saves nothing (that is what the fixed tool should do; it has only been tested offline). The Platform is at Stow and every axis Idle before the Ctrl-C.
    stop_if: A Fault blocks the teardown; deal with it before Ctrl-C.
    record: Whether the capture saved anything on the clean Idle, and its last lines.
    serves: []

  - n: 51
    kind: restore
    title: Close out
    from: []
    to: []
    actions:
      - where: Claude Session
        text: "In a Session in the live checkout, run /sitting-debrief 2026-11-18. It returns the checkout to main if it is still on night-shift/sitting-2026-11-18, and copies the runtime records and Memory back into the tracked files."
    see: The debrief starts its inventory.
    stop_if: Nothing here stops anything.
    serves: []
