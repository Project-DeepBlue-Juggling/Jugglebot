schema: 1
date: "2026-11-18"
rig: robot
omitted:
  - item: FEAT-39
    reason: The Dwell ladder flew on 2026-11-13 and failed (carried Throws land long as Dwell shortens). No code under it has changed, so flying it again would repeat that result. Owner agreed 2026-11-13.
  - item: FEAT-32
    reason: The ZVD A/B waits for BUG-90's fix. This sheet flies BUG-90's own row (steps 35 and 36) from the held branch first.
  - item: FEAT-50
    reason: Its branch has five audit findings open for a day Session, so it is not stacked on today's candidate branch. Owner agreed to leave it out.
  - item: BUG-93
    reason: It needs can-bridge FW 44 flashed, and its firmware change has three audit findings open. A firmware change today would also confound BUG-89's stream measurement. Its branch is not on today's candidate.
  - item: IDEA-11
    do: [3]
    reason: The 90 degree Attempts at Apex 0.95 were refused or ended at once on 2026-11-13. The 90 degree flights today are IDEA-22's (Apex 0.975, tilt-back 0 then 0.5 degrees, steps 38 and 39).
steps:
  - n: 1
    kind: setup
    title: Check the checkout is on main and in sync
    from: []
    to: []
    actions:
      - where: Terminal 2
        command: cd ~/Desktop/Jugglebot && git fetch && git status -sb && git log --oneline -1
    see: "## main...origin/main with nothing ahead or behind. temp/learn/ entries showing as untracked are expected."
    stop_if: The branch is not main, or it is ahead of or behind origin/main.
    serves: []

  - n: 2
    kind: setup
    title: Rebuild, because ros_ws changed after the last build
    from: []
    to: []
    actions:
      - where: Terminal 2
        text: The install tree was last built 2026-11-15; BUG-97 (the Juggle result path) merged on 2026-11-16.
        command: cd ~/Desktop/Jugglebot/ros_ws && source /opt/ros/foxy/setup.zsh && colcon build --packages-select jugglebot_interfaces jugglebot && source install/setup.zsh
    see: Summary line with no failed packages.
    stop_if: Any package failed.
    serves: []

  - n: 3
    kind: setup
    title: Launch 1 of 4 (main, cpu_partition off, BUG-89 arm A)
    new_launch: true
    from: []
    to: [launched]
    actions:
      - where: Terminal 1
        command: cd ~/Desktop/Jugglebot/ros_ws && source /opt/ros/foxy/setup.zsh && source install/setup.zsh && ros2 launch jugglebot jugglebot_launch.py cpu_partition:=false 2>&1 | tee -i ~/Desktop/Jugglebot/temp/logs/launch_2026-11-18_1.log
      - where: Hands
        text: Do not pass gc_probe:=false on any launch today (BUG-58 needs the probe on). Wait for Homing to finish before the next step. This is the first launch of the code merged since 2026-11-13, so read the start-up log for anything new.
    see: "BRIDGE_FW_CHECK: OK - can-bridge v43. homing: 7 axes homed. No 'cpu_partition ON' line."
    stop_if: The firmware check is not OK at v43, fewer than 7 axes homed, or any node dies or logs an error at start-up that you have not seen before.
    record: The launch log path.
    serves:
      - item: BUG-89
        do: [0]
      - item: BUG-58
        do: [0]

  - n: 4
    kind: setup
    title: Set up Terminal 2 for parameters, read the plant and the limits
    from: [launched]
    to: [launched]
    actions:
      - where: Terminal 2
        command: source /opt/ros/foxy/setup.zsh && source ~/Desktop/Jugglebot/ros_ws/install/setup.zsh && cd ~/Desktop/Jugglebot
        text: Every later Terminal 2 command assumes this shell and this directory.
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: GUI
        text: Read the Sitting limits.
    see: plant_id reads jugglebot. Sitting limits 600 / 8000 / 200000.
    stop_if: The limits read anything else, or plant_id is not jugglebot (set it with ros2 param set /skill_node plant_id jugglebot).
    record: The limits, and that they came from the GUI.
    serves: []

  - n: 5
    kind: setup
    title: Level the Platform
    from: [launched]
    to: [launched, level]
    actions:
      - where: GUI
        text: "State minimap: hold LEVELLING to confirm. The Platform rises to full Active height."
    see: The minimap passes through LEVELLING and finishes with no Fault.
    stop_if: Any Fault, or the Platform does not rise cleanly.
    serves: []

  - n: 6
    kind: setup
    title: Dress rehearsal for launch 1, three planning checks and the new counter (nothing moves)
    from: [launched, level]
    to: [launched, level]
    actions:
      - where: Terminal 2
        text: Columns.
        command: "ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString \"{data: 'columns,apex_m=0.95,separation_mm=125,dwell_s=0.27'}\""
      - where: Terminal 2
        text: One-ball oval at Dwell 0.50.
        command: "ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString \"{data: 'oval_1ball_fed,apex_m=1.00,separation_mm=150,dwell_s=0.50'}\""
      - where: Terminal 2
        text: High-low Columns (BUG-63).
        command: "ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString \"{data: 'columns_highlow,apex_m=1.00,separation_mm=100,dwell_s=0.27,apex_m_ball2=0.90'}\""
      - where: Terminal 2
        text: The dropped-knot counter is new code in the bridge and has never run on the robot. Watch for a few seconds, then Ctrl-C.
        command: ros2 topic echo /link_status | grep -A1 setpoints_coalesced
    see: "Each nominate reply reads success: True. Since BUG-91 a negative Catch re-aim margin prints in capitals as WARNING: RE-AIM MARGIN NEGATIVE; expect that on the high-low reply (margin -0.245 on 2026-11-10). It is information, not a refusal. The echo prints the key setpoints_coalesced with a number as its value."
    stop_if: "Anything moves. The setpoints_coalesced key never appears (the counter is not running; do not arm, tell a Session). A reply with success: False is not a stop: note the Pattern and the reply, and skip that Pattern's flight steps (Columns: step 8; oval: step 10; high-low: step 13)."
    record: Any refusal line, word for word, and the counter's value.
    serves: []

  - n: 7
    kind: setup
    title: Activate (this arms) and bring up Ball Butler
    from: [launched, level]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: GUI
        text: "State minimap: hold ACTIVE:TRAJECTORY to confirm. The launch's auto_arm arms the setpoint wire on entry."
      - where: Hands
        text: Power Ball Butler, calibrate it as you usually do, and load it. Cup empty.
    see: Mode ACTIVE:TRAJECTORY, Armed, no Fault. Ball Butler powered and holding a ball.
    stop_if: Any refusal or Fault on activation.
    serves: []

  - n: 8
    kind: run
    title: Columns, 8 Attempts (arm A, and the first flight of this week's code)
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: GUI
        text: "Juggle panel: Columns, Sep. 125, Apex 0.95, Dwell 0.27, Throws 21. Start. Eight Attempts in a row. Before each Attempt: Cup empty, Ball Butler loaded."
      - where: Hands
        text: Watch the first Attempt closely. The executor, the Juggle result path and the link's send counters all changed since 2026-11-13 and none of it has flown. After each Attempt ends, check the GUI lets you Start the next one (BUG-97 changed how a goal ends).
      - where: Terminal 2
        text: After the FIRST Attempt, before the other seven. The learner Memory now lives under temp/runtime, copied once from the tracked file (new since 2026-11-14, never run on the robot). This shows the copy.
        command: cat ~/Desktop/Jugglebot/temp/runtime/learn/jugglebot/memory_v2.csv.seed
    see: After the first Attempt the seed file names temp/learn/jugglebot/memory_v2.csv and shows rows near 4818. Attempts fly as on 2026-11-13 (that day's Columns Attempts ran 5 to 20 Catches). The Leg base joints stay seated. Each ended Attempt reports its result and the next Start is accepted.
    stop_if: The seed file is missing or shows rows 0 (the learner started with an empty Memory) - go to step 15, stand down and tell a Session. The first Attempt moves differently from what you know (jerky Platform, a Hand stroke that looks wrong) - go to step 15 and stand down. Any Leg base joint moves or separates (BUG-72) - do not continue this sheet; tell a Session. A Ball trapped under the Hand clears itself; note the time.
    record: Caught of thrown and the end code per Attempt, and the time of any LANE_REFUSED end. The first five Attempts are also IDEA-11's straight Columns control.
    serves:
      - item: BUG-89
        do: [0]
      - item: IDEA-11
        do: [1]

  - n: 9
    kind: setup
    title: Check the runtime files again and that the checkout stayed clean
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        text: The same file as in step 8.
        command: cat ~/Desktop/Jugglebot/temp/runtime/learn/jugglebot/memory_v2.csv.seed
      - where: Terminal 2
        command: git status -sb
    see: The seed file names temp/learn/jugglebot/memory_v2.csv as its source and shows rows near 4818. git status shows no modified file (docs/records.md and memory_v2.csv no longer go dirty during a Sitting).
    stop_if: The seed file is missing or shows rows 0 - the learner started with an empty Memory. Go to step 15, stand down and tell a Session; do not fly on.
    record: The rows number.
    serves: []

  - n: 10
    kind: run
    title: One-ball oval on its own plant, 6 Attempts (arm A)
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        text: A plant of its own keeps these Throws out of the Columns Memory. Refused while a goal runs.
        command: ros2 param set /skill_node plant_id bug89-oval-2026-11-18
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: Hands
        text: Empty the Cup after every ended Attempt before re-sending a fed goal. Cup empty, Ball Butler loaded.
      - where: Terminal 2
        text: Six Attempts. BUG-89 asks for at least 10 minutes of Attempt time in each arm; if Attempts here or in step 8 ended early, fly more of this goal until the two steps add up to about 10 minutes, and write down how many you flew of each (step 21 matches it). BUG-89's row names the Pattern and not its settings; these are the Dwell 0.50 settings flown on 2026-11-13. The plant is fresh, so the first Attempts may end on an early missed Catch.
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.50, num_cycles: 32}" --feedback'
    see: plant_id reads bug89-oval-2026-11-18. Six Attempts fly.
    stop_if: plant_id does not read back (do not fly). Any Leg base joint moves (stop the sheet there, stand down and tell a Session).
    record: Caught of thrown and the end code per Attempt, and the time of any LANE_REFUSED end.
    serves:
      - item: BUG-89
        do: [0]

  - n: 11
    kind: run
    title: Read arm A's counter and STOP lines
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        text: Watch for a few seconds, then Ctrl-C.
        command: ros2 topic echo /link_status | grep -A1 setpoints_coalesced
      - where: Terminal 2
        text: BUG-89's row greps the ROS log; the copy of the launch output saved under temp/logs is the same text.
        command: grep -nE "setpoint drain dropped|firmware scheduler STOP|firmware STOP record|LANE_REFUSED" ~/Desktop/Jugglebot/temp/logs/launch_2026-11-18_1.log
    see: A counter value, and zero or more WARN lines. On 2026-11-13 the bridge dropped about 3 knots a minute during Attempts, so a non-zero counter is expected.
    stop_if: Nothing here stops the Sitting.
    record: The counter value at this point, the number of 'setpoint drain dropped' lines and their lag range, and each STOP or LANE_REFUSED line. The per-STOP verdicts are read at the debrief.
    serves:
      - item: BUG-89
        do: [0]

  - n: 12
    kind: restore
    title: Put the plant back before the high-low row
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Hands
        text: Empty the Cup.
      - where: Terminal 2
        command: ros2 param set /skill_node plant_id jugglebot
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
    see: plant_id reads jugglebot.
    stop_if: It does not read jugglebot.
    serves: []

  - n: 13
    kind: run
    title: High-low Columns on a fresh plant (BUG-63)
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Hands
        text: Cup empty. Ball Butler loaded. BUG-63's row says to fly this right after the IDEA-10 high-low Attempts; IDEA-10 closed on 2026-11-13, so it flies on its own here with the same settings.
      - where: Terminal 2
        text: A name no Memory file has. Refused while a goal runs.
        command: ros2 param set /skill_node plant_id bug63-fresh-2026-11-18
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: Terminal 2
        command: ros2 param set /skill_node apex_m_ball2 0.90
      - where: GUI
        text: "Juggle panel: Columns - high-low, Apex 1.00, Apex 2 0.90, Sep. 100, Dwell 0.27, Throws 21. One Attempt. A second only if the first ended before Ball 2's first Throw for an unrelated reason."
      - where: GUI
        text: Watch Hand current at every launch. Cancel the goal if any Hand iq sample reaches 55.0 A.
    see: plant_id reads bug63-fresh-2026-11-18. Ball 2's first Throw after the Feed Catch lands within 60 mm of its Site along the separation axis.
    stop_if: plant_id does not read back (do not fly). Any Hand iq sample reaches 55.0 A (cancel the goal).
    record: The plant_id, Ball 2's first-Throw landing (x, y) mm and its aim from the install line, the Feed-Catch aim line (clamped or not), how the Attempt ended, the bag path.
    serves:
      - item: BUG-63
        do: [0, 1]
        pass: true

  - n: 14
    kind: restore
    title: Put the plant and Apex 2 back
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        command: ros2 param set /skill_node plant_id jugglebot
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: Terminal 2
        command: ros2 param set /skill_node apex_m_ball2 0.0
    see: plant_id reads jugglebot and the apex_m_ball2 set reports success.
    stop_if: Either fails.
    serves:
      - item: BUG-63
        do: [2]

  - n: 15
    kind: restore
    title: Stand down launch 1
    from: [launched, level, armed, bb-fed]
    to: []
    actions:
      - where: GUI
        text: "State minimap: hold IDLE to confirm (safe teardown, disarms)."
      - where: Terminal 1
        text: Ctrl-C the launch and wait for the shell prompt.
      - where: Hands
        text: Empty the Cup.
    see: The Platform is at Stow and every axis Idle before the Ctrl-C. The bag closes.
    stop_if: A Fault blocks the teardown; deal with it before Ctrl-C.
    serves: []

  - n: 16
    kind: setup
    title: Launch 2 of 4 (main, cpu_partition on, BUG-89 arm B)
    new_launch: true
    from: []
    to: [launched]
    actions:
      - where: Terminal 1
        command: cd ~/Desktop/Jugglebot/ros_ws && source /opt/ros/foxy/setup.zsh && source install/setup.zsh && ros2 launch jugglebot jugglebot_launch.py cpu_partition:=true 2>&1 | tee -i ~/Desktop/Jugglebot/temp/logs/launch_2026-11-18_2.log
      - where: Hands
        text: "Mocap must be tracking the robot base markers AND Ball Butler's Base markers for this launch: the turned Columns in step 23 picks the fed Site by Ball Butler's position. Wait for Homing to finish."
    see: "BRIDGE_FW_CHECK: OK - can-bridge v43. A 'BUG-58 cpu_partition ON' line from both teensy_bridge_node and trajectory_node, each naming the cpus it is pinned to. homing: 7 axes homed."
    stop_if: The firmware check is not OK at v43, fewer than 7 axes homed, or a cpu_partition ON line is missing from either node (the arm is not what it claims; stand down and tell a Session).
    record: The launch log path and the two cpu_partition lines.
    serves:
      - item: BUG-89
        do: [1]

  - n: 17
    kind: setup
    title: Level the Platform
    from: [launched]
    to: [launched, level]
    actions:
      - where: GUI
        text: "State minimap: hold LEVELLING to confirm and let it finish."
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
    see: The minimap passes through LEVELLING and finishes with no Fault. plant_id reads jugglebot.
    stop_if: Any Fault, or the Platform does not rise cleanly.
    serves: []

  - n: 18
    kind: setup
    title: Dress rehearsal for launch 2, three planning checks (nothing moves)
    from: [launched, level]
    to: [launched, level]
    actions:
      - where: Terminal 2
        text: Columns.
        command: "ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString \"{data: 'columns,apex_m=0.95,separation_mm=125,dwell_s=0.27'}\""
      - where: Terminal 2
        text: One-ball oval at Dwell 0.50.
        command: "ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString \"{data: 'oval_1ball_fed,apex_m=1.00,separation_mm=150,dwell_s=0.50'}\""
      - where: Terminal 2
        text: Turned Columns at 45 degrees (IDEA-11).
        command: "ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString \"{data: 'columns_turned,apex_m=0.95,separation_mm=125,dwell_s=0.27,columns_angle_deg=45'}\""
    see: "Each reply reads success: True. Nothing moves."
    stop_if: "Anything moves. A turned reply saying Ball Butler's position is unknown is not a planning refusal: bring mocap up on the robot base and Ball Butler's Base markers and call again; never skip the Pattern for it. A reply with success: False is not a stop: note it and skip that Pattern's flight step (Columns: step 20; oval: step 21; turned: step 23)."
    record: Any refusal line or WARNING line, word for word.
    serves:
      - item: IDEA-11
        do: [0]
        reorder: Its straight Columns control (do 1) flew in launch 1 as step 8. The turned rehearsal belongs to this launch, the one that flies the turned Pattern, and still comes before any turned goal. Only the 45 degree call is made; the 90 degree call belongs to IDEA-22 in step 29.

  - n: 19
    kind: setup
    title: Activate (this arms), Ball Butler loaded
    from: [launched, level]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: GUI
        text: "State minimap: hold ACTIVE:TRAJECTORY to confirm."
      - where: Hands
        text: Ball Butler powered and loaded. Cup empty.
    see: Mode ACTIVE:TRAJECTORY, Armed, no Fault.
    stop_if: Any refusal or Fault.
    serves: []

  - n: 20
    kind: run
    title: Columns, 8 Attempts (arm B)
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: GUI
        text: "Juggle panel: Columns, Sep. 125, Apex 0.95, Dwell 0.27, Throws 21. Start. Eight Attempts in a row, the same as step 8. Before each Attempt: Cup empty, Ball Butler loaded."
    see: Attempts fly as in step 8.
    stop_if: Any Leg base joint moves or separates. The Platform or Hand moves differently from launch 1 (the pinned cpus are the only change) - stand down at step 25 and note what you saw.
    record: Caught of thrown and the end code per Attempt, and the time of any LANE_REFUSED end.
    serves:
      - item: BUG-89
        do: [1]

  - n: 21
    kind: run
    title: One-ball oval on the arm A plant, 6 Attempts (arm B)
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        text: The same plant as step 10. Refused while a goal runs.
        command: ros2 param set /skill_node plant_id bug89-oval-2026-11-18
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: Hands
        text: Empty the Cup after every ended Attempt before re-sending a fed goal. Cup empty, Ball Butler loaded.
      - where: Terminal 2
        text: The same number of Attempts as you flew in step 10 (six, or more if you added some), so both arms have about the same Attempt time.
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.50, num_cycles: 32}" --feedback'
    see: plant_id reads bug89-oval-2026-11-18. Six Attempts fly.
    stop_if: plant_id does not read back (do not fly). Any Leg base joint moves (stop the sheet there, stand down and tell a Session).
    record: Caught of thrown and the end code per Attempt, and the time of any LANE_REFUSED end.
    serves:
      - item: BUG-89
        do: [1]

  - n: 22
    kind: run
    title: Read arm B's counter and STOP lines
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        text: Watch for a few seconds, then Ctrl-C.
        command: ros2 topic echo /link_status | grep -A1 setpoints_coalesced
      - where: Terminal 2
        command: grep -nE "setpoint drain dropped|firmware scheduler STOP|firmware STOP record|LANE_REFUSED" ~/Desktop/Jugglebot/temp/logs/launch_2026-11-18_2.log
    see: A counter value, and zero or more WARN lines, to set beside step 11's.
    stop_if: Nothing here stops the Sitting.
    record: "The counter value at this point, the number of 'setpoint drain dropped' lines and their lag range, each STOP or LANE_REFUSED line, and both launch log paths. Type pending: the side-by-side table and each STOP's verdict are computed at the debrief."
    serves:
      - item: BUG-89
        do: [1]
        pass: true

  - n: 23
    kind: run
    title: Turned Columns at 45 degrees, 2 Attempts
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Hands
        text: Empty the Cup. Ball Butler loaded.
      - where: Terminal 2
        text: Refused while a goal runs.
        command: ros2 param set /skill_node plant_id turned45
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: GUI
        text: "Juggle panel: Columns - turned, Angle 45, Apex 0.95, Sep. 125, Dwell 0.27, Throws 21. Only the 0.925 to 0.975 Apex band is admissible at 45 deg. Start writes columns_angle_deg to the node. Two Attempts."
      - where: Terminal 2
        text: Only if the GUI will not start it. Refused while a goal runs.
        command: ros2 param set /skill_node columns_angle_deg 45
      - where: Terminal 2
        text: Only if the GUI will not start it.
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: columns_turned, apex_m: 0.95, separation_mm: 125.0, dwell_s: 0.27, num_cycles: 21}" --feedback'
    see: plant_id reads turned45. IDEA-11 needs one Attempt reading COMPLETED (20/20 caught), and no HAND_LIMIT line.
    stop_if: Any HAND_LIMIT line, or any Leg base joint moves (stop the sheet there, stand down and tell a Session).
    record: "Caught of thrown per Attempt, the plant_id, Ball 2's first-Throw landing (x, y) mm per Attempt, the bag path. Type pending: the landing scatter against the step 8 control is computed at the debrief."
    serves:
      - item: IDEA-11
        do: [2, 4]
        reorder: Its do list states "set the plant before each angle's first goal" after the goals it governs.
        pass: true

  - n: 24
    kind: restore
    title: Put the turned angle and the plant back
    from: [launched, level, armed, bb-fed]
    to: [launched, level, armed, bb-fed]
    actions:
      - where: Hands
        text: Empty the Cup.
      - where: Terminal 2
        command: ros2 param set /skill_node columns_angle_deg 0
      - where: Terminal 2
        command: ros2 param set /skill_node plant_id jugglebot
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
    see: The angle set reports success and plant_id reads jugglebot.
    stop_if: Either fails.
    serves:
      - item: IDEA-11
        do: [5]

  - n: 25
    kind: restore
    title: Stand down launch 2
    from: [launched, level, armed, bb-fed]
    to: []
    actions:
      - where: GUI
        text: "State minimap: hold IDLE to confirm."
      - where: Terminal 1
        text: Ctrl-C the launch and wait for the shell prompt.
      - where: Hands
        text: Empty the Cup.
    see: The Platform is at Stow and every axis Idle before the Ctrl-C.
    stop_if: A Fault blocks the teardown; deal with it before Ctrl-C.
    serves: []

  - n: 26
    kind: setup
    title: Check out the candidate branch (five held Items) and build it
    from: []
    to: []
