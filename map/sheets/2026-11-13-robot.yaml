schema: 1
date: "2026-11-13"
rig: robot
omitted:
  - item: FEAT-49
    reason: Its own first step says not to fly it until FEAT-45 rungs B and C have passed on the bench Hand with the fixed scope tool. FEAT-45 is still in progress (rung B never ran on 2026-11-11).
  - item: IDEA-22
    do: [3]
    reason: "TKT-67 is answered with option 1: keep the 3 degree tilt-back and fly at Apex 0.90. The row's other route (set the tilt-back to 1.9 degrees and stay at Apex 0.95) is not flown; the Apex 0.90 planning check it asks for is in step 27."
steps:
  - n: 1
    kind: setup
    title: Check the checkout is on main and in sync
    from: []
    to: []
    actions:
      - where: Terminal 2
        command: cd ~/Desktop/Jugglebot && git fetch && git status -sb && git log --oneline -1
    see: "## main...origin/main with nothing ahead or behind. temp/learn/ entries showing as untracked are expected."
    stop_if: The branch is not main, or it is ahead of or behind origin/main.
    serves: []

  - n: 2
    kind: setup
    title: Rebuild, because ros_ws changed on the last two nights
    from: []
    to: []
    actions:
      - where: Terminal 2
        command: cd ~/Desktop/Jugglebot/ros_ws && source /opt/ros/foxy/setup.bash && colcon build --packages-up-to jugglebot && source install/setup.bash
    see: Summary line with no failed packages.
    stop_if: Any package failed.
    serves: []

  - n: 3
    kind: setup
    title: Power-cycle the can-bridge
    from: []
    to: [bridge-cycled]
    actions:
      - where: Hands
        text: Power-cycle the can-bridge. FEAT-39 and FEAT-32 both ask for a cycled bridge.
    see: The can-bridge is back up.
    stop_if: It does not come back up.
    serves: []

  - n: 4
    kind: setup
    title: Launch 1 of 4 (main, default arguments)
    new_launch: true
    from: [bridge-cycled]
    to: [bridge-cycled, launched]
    actions:
      - where: Terminal 1
        command: cd ~/Desktop/Jugglebot/ros_ws && source /opt/ros/foxy/setup.bash && source install/setup.bash && ros2 launch jugglebot jugglebot_launch.py 2>&1 | tee -i ../temp/logs/launch_2026-11-13_1.log
      - where: Hands
        text: Do not pass gc_probe:=false on any launch today (BUG-58 needs the probe on). Wait for Homing to finish before the next step.
    see: "BRIDGE_FW_CHECK: OK - can-bridge v43 (FEAT-39's row still says FW 40 and FEAT-46's FW 42; the bridge has been FW 43 / PROTOCOL 14, Platform FW 10, since 2026-11-10). homing: 7 axes homed."
    stop_if: The firmware check is not OK at v43, or fewer than 7 axes homed.
    record: The launch log path.
    serves:
      - item: FEAT-39
        do: [0]
      - item: BUG-58
        do: [0]
      - item: FEAT-46
        do: [0]

  - n: 5
    kind: setup
    title: Set up Terminal 2 for parameters, read the plant and the limits
    from: [bridge-cycled, launched]
    to: [bridge-cycled, launched]
    actions:
      - where: Terminal 2
        command: source /opt/ros/foxy/setup.bash && source ~/Desktop/Jugglebot/ros_ws/install/setup.bash && cd ~/Desktop/Jugglebot
        text: Every later Terminal 2 command assumes this shell and this directory.
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: GUI
        text: Read the Sitting limits.
    see: plant_id reads jugglebot. Sitting limits 600 / 8000 / 200000.
    stop_if: The limits read anything else, or plant_id is not jugglebot (set it with ros2 param set /skill_node plant_id jugglebot).
    record: The limits, and that they came from the GUI.
    serves:
      - item: FEAT-39
        do: [1]

  - n: 6
    kind: setup
    title: Level the Platform
    from: [bridge-cycled, launched]
    to: [bridge-cycled, launched, level]
    actions:
      - where: GUI
        text: "State minimap: hold LEVELLING to confirm. The Platform rises to full Active height."
    see: The minimap passes through LEVELLING and finishes with no Fault.
    stop_if: Any Fault, or the Platform does not rise cleanly.
    serves: []

  - n: 7
    kind: setup
    title: Dress rehearsal for launch 1, two planning checks (nothing moves)
    from: [bridge-cycled, launched, level]
    to: [bridge-cycled, launched, level]
    actions:
      - where: Terminal 2
        text: One-ball oval (FEAT-39).
        command: "ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString \"{data: 'oval_1ball_fed,apex_m=1.00,separation_mm=150,dwell_s=0.40'}\""
      - where: Terminal 2
        text: High-low Columns (IDEA-10).
        command: "ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString \"{data: 'columns_highlow,apex_m=1.00,separation_mm=100,dwell_s=0.27,apex_m_ball2=0.90'}\""
    see: "Each reply reads success: True with a one-line 'nomination OK' summary. These are planning checks only, so the Platform and the Hand stay still. Expect the high-low reply to show a negative margin with the Catch re-aim at its limit (-0.245 on 2026-11-10) and the words 'An Attempt may end mid-Pattern': that is information, not a refusal."
    stop_if: "Anything moves. A reply with success: False is not a stop; note which Pattern and what the reply says, and skip that Pattern's flight steps (oval: steps 10 to 12; high-low: steps 14 to 16)."
    record: Any refusal line, word for word.
    serves:
      - item: FEAT-39
        do: [2]
      - item: IDEA-10
        do: [0]

  - n: 8
    kind: setup
    title: Activate (this arms) and bring up Ball Butler
    from: [bridge-cycled, launched, level]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: GUI
        text: "State minimap: hold ACTIVE:TRAJECTORY to confirm. The launch's auto_arm arms the setpoint wire on entry."
      - where: Hands
        text: Power Ball Butler and load it. Cup empty.
    see: Mode ACTIVE:TRAJECTORY, Armed, no Fault. Ball Butler powered and holding a ball.
    stop_if: Any refusal or Fault on activation.
    serves: []

  - n: 9
    kind: run
    title: Columns canary, 5 Attempts
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: GUI
        text: "Juggle panel: Columns, Sep. 125, Apex 0.95, Dwell 0.27, Throws 21. Start. Five Attempts in a row. Before each Attempt: Cup empty, Ball Butler loaded."
      - where: GUI
        text: Watch Leg current through every Attempt. Cancel the goal if any Leg iq sample reaches 19 A.
    see: Each Attempt reads COMPLETED (20/20 caught), no Leg LIMIT end, peak Leg iq under 20 A. The Leg base joints stay seated.
    stop_if: Any Leg iq sample reaches 19 A, or any Leg base joint moves or separates (BUG-72). Do not continue this sheet if a joint lets go; tell a Session.
    record: Caught of thrown and the end code per Attempt; the CATCH Leg-velocity refusal count. These five also stand as IDEA-11's straight Columns control for steps 32 and 33.
    serves:
      - item: FEAT-39
        do: [3, 4]
      - item: IDEA-11
        do: [1]

  - n: 10
    kind: run
    title: One-ball oval at Dwell 0.50 on its own plant
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        text: Refused while a goal runs.
        command: ros2 param set /skill_node plant_id p4-oval-2026-11-13
      - where: Terminal 2
        text: Read it back here. FEAT-39's row says to read it from the goal start line, but fed goals do not print plant_id there (found at the 2026-11-10 debrief).
        command: ros2 param get /skill_node plant_id
      - where: Hands
        text: Cup empty, Ball Butler loaded.
      - where: Terminal 2
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.50, num_cycles: 32}" --feedback'
    see: plant_id reads p4-oval-2026-11-13. One Attempt flies. Landings about 46 +/- 10 mm long, as at 350 / 5000 on 2026-10-31, clear P4 of the long bias.
    stop_if: plant_id does not read back (do not fly). Any Leg iq sample reaches 19 A (cancel the goal), or any Leg joint moves.
    record: Caught of thrown, end code, the raw long bias from rest and carried.
    serves:
      - item: FEAT-39
        do: [5, 6]

  - n: 11
    kind: run
    title: Oval ladder at Dwell 0.40, then 0.35
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: Hands
        text: Empty the Cup after every ended Attempt before re-sending a fed goal. Cup empty, Ball Butler loaded.
      - where: Terminal 2
        text: Dwell 0.40, fed.
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.40, num_cycles: 32}" --feedback'
      - where: Terminal 2
        text: Then Dwell 0.40 at oval_1ball. Put the ball in the Cup by hand first.
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.40, num_cycles: 32}" --feedback'
      - where: Terminal 2
        text: Dwell 0.35, only after one Attempt above with no Leg LIMIT, Guard or HAND_LIMIT end. Empty the Cup first; Ball Butler loaded.
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.35, num_cycles: 32}" --feedback'
    see: Attempts run with no Leg LIMIT, Guard or HAND_LIMIT end.
    stop_if: A Leg LIMIT, Guard or HAND_LIMIT end at 0.40 means do not go to 0.35; go to step 12, skip its commands and give FEAT-39's verdict there. Any Leg iq sample at 19 A, cancel the goal.
    record: Caught of thrown and end code per Attempt; the raw long bias per Dwell, from rest and carried; the LIMIT_JERK refusal count.
    serves:
      - item: FEAT-39
        do: [7]

  - n: 12
    kind: run
    title: Oval at Dwell 0.30 and Apex 1.10, only if 0.35 held
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        text: Only if Dwell 0.35 held. This reads the nomination at the live limits; nothing moves.
        command: "ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString \"{data: 'oval_1ball_fed,apex_m=1.10,separation_mm=150,dwell_s=0.30'}\""
      - where: Terminal 2
        text: "Only if that reply reads success: True. Cup empty, Ball Butler loaded."
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.10, separation_mm: 150.0, dwell_s: 0.30, num_cycles: 32}" --feedback'
    see: "The nomination reads success: True. 'Held' means one Attempt at Dwell 0.35 in step 11 ended with no Leg LIMIT, Guard or HAND_LIMIT end. If 0.35 did not hold or was not flown, skip both commands. Either way, give FEAT-39's verdict on this step, on what flew."
    stop_if: Nomination refused (do not fly), or any Leg iq sample at 19 A.
    record: The shortest Dwell reaching 30 consecutive Catches; the oval plant_id; bag and launch log paths. Peak Leg iq per Leg per Attempt comes from the bag at the debrief.
    serves:
      - item: FEAT-39
        do: [8]
        pass: true

  - n: 13
    kind: restore
    title: Put the plant back before the Columns rows
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: Hands
        text: Empty the Cup.
      - where: Terminal 2
        command: ros2 param set /skill_node plant_id jugglebot
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
    see: plant_id reads jugglebot. The oval Throws stay out of the Columns Memory.
    stop_if: It does not read jugglebot.
    serves: []

  - n: 14
    kind: run
    title: High-low Columns (IDEA-10)
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: Hands
        text: Before each Attempt, Cup empty and Ball Butler loaded.
      - where: GUI
        text: "Juggle panel: Columns - high-low, Apex 1.00, Apex 2 0.90, Sep. 100, Dwell 0.27, Throws 21. Start writes apex_m_ball2 to the node."
      - where: Terminal 2
        text: Only if the GUI will not start it. Refused while a goal runs.
        command: 'ros2 param set /skill_node apex_m_ball2 0.90'
      - where: Terminal 2
        text: Only if the GUI will not start it.
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: columns_highlow, apex_m: 1.00, separation_mm: 100.0, dwell_s: 0.27, num_cycles: 21}" --feedback'
      - where: GUI
        text: Watch Hand current at every launch. Cancel the goal if any Hand iq sample reaches 55.0 A.
    see: COMPLETED (20/20 caught), the two Balls' mean Tracker Apexes differing by 100 mm give or take 20 mm, Hand iq under 54 A at every launch (the brake is excluded).
    stop_if: Any Hand iq sample reaches 55.0 A (cancel the goal).
    record: Caught of thrown, each Ball's mean Tracker Apex, peak Hand iq per launch, Ball 2's first-Throw landing (x, y) mm per Attempt from the install line, the bag path.
    serves:
      - item: IDEA-10
        do: [1, 2]
        pass: true

  - n: 15
    kind: run
    title: Same settings on a fresh plant (BUG-63)
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: Hands
        text: Empty the Cup. Ball Butler loaded.
      - where: Terminal 2
        text: A name no Memory file has. Refused while a goal runs.
        command: ros2 param set /skill_node plant_id bug63-fresh-2026-11-13
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: Terminal 2
        command: ros2 param set /skill_node apex_m_ball2 0.90
      - where: GUI
        text: "Juggle panel: Columns - high-low, Apex 1.00, Apex 2 0.90, Sep. 100, Dwell 0.27, Throws 21. One Attempt. A second only if the first ended before Ball 2's first Throw for an unrelated reason."
    see: plant_id reads bug63-fresh-2026-11-13. Ball 2's first Throw after the Feed Catch lands within 60 mm of its Site along the separation axis.
    stop_if: plant_id does not read back (do not fly). Any Hand iq sample reaches 55.0 A (cancel the goal).
    record: The plant_id, Ball 2's first-Throw landing (x, y) mm and its aim from the install line, the Feed-Catch aim line (clamped or not), how the Attempt ended, the bag path.
    serves:
      - item: BUG-63
        do: [0, 1]
        pass: true

  - n: 16
    kind: restore
    title: Put the plant and Apex 2 back
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        text: The plant step 14 flew on.
        command: ros2 param set /skill_node plant_id jugglebot
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: Terminal 2
        command: ros2 param set /skill_node apex_m_ball2 0.0
    see: plant_id reads jugglebot and the apex_m_ball2 set reports success.
    stop_if: Either fails.
    serves:
      - item: BUG-63
        do: [2]
      - item: IDEA-10
        do: [3]

  - n: 17
    kind: restore
    title: Stand down launch 1
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled]
    actions:
      - where: GUI
        text: "State minimap: hold IDLE to confirm (safe teardown, disarms)."
      - where: Terminal 1
        text: Ctrl-C the launch and wait for the shell prompt.
      - where: Hands
        text: Empty the Cup.
    see: The Platform is at Stow and every axis Idle before the Ctrl-C. The bag closes.
    stop_if: A Fault blocks the teardown; deal with it before Ctrl-C.
    serves: []

  - n: 18
    kind: setup
    title: Launch 2 of 4 (main, gc_freeze on, FEAT-32)
    new_launch: true
    from: [bridge-cycled]
    to: [bridge-cycled, launched]
    actions:
      - where: Terminal 1
        command: ros2 launch jugglebot jugglebot_launch.py gc_freeze:=true 2>&1 | tee -i ../temp/logs/launch_2026-11-13_2.log
      - where: Terminal 2
        text: After Homing finishes.
        command: ros2 param get /skill_node carry_zvd
    see: "BRIDGE_FW_CHECK: OK - can-bridge v43 (FEAT-32's row still says v40). A BUG-58 gc_freeze ON line from both teensy_bridge_node and trajectory_node. homing: 7 axes homed. carry_zvd reads false."
    stop_if: A gc_freeze ON line is missing from either node, or carry_zvd reads true.
    record: The launch log path.
    serves:
      - item: FEAT-32
        do: [0]

  - n: 19
    kind: setup
    title: Level, then Activate, Ball Butler loaded
    from: [bridge-cycled, launched]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: GUI
        text: "State minimap: hold LEVELLING to confirm and let it finish."
      - where: GUI
        text: "State minimap: hold ACTIVE:TRAJECTORY to confirm."
      - where: Hands
        text: Ball Butler powered and loaded. Cup empty.
    see: Mode ACTIVE:TRAJECTORY, Armed, no Fault.
    stop_if: Any refusal or Fault.
    serves: []

  - n: 20
    kind: run
    title: ZVD A arm, flag off, Dwell 0.40
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: Terminal 2
        command: ros2 param set /skill_node plant_id zvd-oval-2026-11-13
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: Terminal 2
        text: One Attempt. Cup empty, Ball Butler loaded.
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.40, num_cycles: 32}" --feedback'
      - where: Hands
        text: Empty the Cup after every ended Attempt before re-sending a fed goal. After clear_errors re-enter TRAJECTORY before the next goal.
    see: plant_id reads zvd-oval-2026-11-13. One Attempt runs.
    stop_if: A CUP_SEATING_CONE or Leg LIMIT end, or any Leg joint moves.
    record: Raw x per Throw (landed minus u), from rest and carried; encoder and mocap excess at separation; install-line Leg peaks.
    serves:
      - item: FEAT-32
        do: [1, 2]

  - n: 21
    kind: run
    title: ZVD B arm, flag on, Dwell 0.40 then 0.35
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: Hands
        text: Empty the Cup after every ended Attempt before re-sending a fed goal. After clear_errors re-enter TRAJECTORY before the next goal.
      - where: Terminal 2
        text: Refused while a goal runs.
        command: ros2 param set /skill_node carry_zvd true
      - where: Terminal 2
        command: ros2 param get /skill_node carry_zvd
      - where: Terminal 2
        text: Same goal at Dwell 0.40, same plant. Cup empty, Ball Butler loaded.
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.40, num_cycles: 32}" --feedback'
      - where: Terminal 2
        text: Dwell 0.35, only if 0.40 held. Offline the rows plan Leg peaks of 316 mm/s and 5120 mm/s^2 at 0.35.
        command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.35, num_cycles: 32}" --feedback'
    see: carry_zvd reads true, and the goal start line shows carry_zvd.
    stop_if: A CUP_SEATING_CONE or Leg LIMIT end, or any Leg joint moves.
    record: Raw x per Throw split per arm, from rest and carried; encoder and mocap excess at separation; RING refusal text if any oval install is refused; install-line Leg peaks.
    serves:
      - item: FEAT-32
        do: [3]

  - n: 22
    kind: run
    title: Columns canary with the flag off, 2 Attempts
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled, launched, level, armed, bb-fed]
    actions:
      - where: Hands
        text: Empty the Cup. Ball Butler loaded.
      - where: Terminal 2
        command: ros2 param set /skill_node carry_zvd false
      - where: Terminal 2
        command: ros2 param get /skill_node carry_zvd
      - where: Terminal 2
        text: Off the ZVD plant, so these Columns Throws stay out of the oval Memory.
        command: ros2 param set /skill_node plant_id jugglebot
      - where: Terminal 2
        command: ros2 param get /skill_node plant_id
      - where: GUI
        text: "Juggle panel: Columns, Sep. 125, Apex 0.95, Dwell 0.27, Throws 21. Two Attempts. Before each: Cup empty, Ball Butler loaded."
    see: carry_zvd reads false and plant_id reads jugglebot. Each Attempt COMPLETED, no new refusal.
    stop_if: carry_zvd does not read false (do not fly Columns), or any Leg joint moves.
    record: Each Attempt's end; the bag and launch log paths.
    serves:
      - item: FEAT-32
        do: [4]
        pass: true

  - n: 23
    kind: restore
    title: Stand down launch 2 and re-fit the mode
    from: [bridge-cycled, launched, level, armed, bb-fed]
    to: [bridge-cycled]
    actions:
      - where: GUI
        text: "State minimap: hold IDLE to confirm."
      - where: Terminal 1
        text: Ctrl-C the launch and wait for the shell prompt.
      - where: Hands
        text: Empty the Cup.
      - where: Terminal 2
        text: Use the bag launch 2 recorded (the newest folder in ~/Desktop/rosbags). The brackets keep the venv out of this shell.
        command: (source ~/Desktop/PDJ_venv/venv/bin/activate && python tools/probes/platform_mode_fit.py ~/Desktop/rosbags/<bag from launch 2>)
    see: The Platform is at Stow and every axis Idle before the Ctrl-C. The fit prints x and y.
    stop_if: A Fault blocks the teardown; deal with it before Ctrl-C. A failed fit does not stop the Sitting; it can run at the debrief.
    record: The platform_mode_fit.py result (x and y).
    serves:
      - item: FEAT-32
        do: [5]

  - n: 24
    kind: setup
    title: Check out the candidate branch (IDEA-22 and BUG-80) and build it
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Hands
        text: The branch is already built and pushed. Do NOT run tools/night_shift_candidate.sh today; both held branches conflict with main in their document files and it would stack neither. The launch must be down.
      - where: Terminal 2
        command: git fetch && git checkout night-shift/sitting-2026-11-13 && git log --oneline -2
      - where: Terminal 2
        text: From here on Terminal 1 launches this build.
        command: cd ~/Desktop/Jugglebot/ros_ws && colcon build --packages-up-to jugglebot && source install/setup.bash; cd ~/Desktop/Jugglebot
    see: "The two newest commits read candidate(sitting-2026-11-13): IDEA-22 ... and candidate(sitting-2026-11-13): BUG-80 .... The build finishes with no failed packages."
    stop_if: "The checkout or the build fails. Then run git checkout main, run the build command above again, and go to step 39: steps 25 to 38 need this branch."
    serves: []

  - n: 25
    kind: setup
    title: Launch 3 of 4 (candidate branch)
    new_launch: true
    from: [bridge-cycled]
    to: [bridge-cycled, launched]
    actions:
      - where: Terminal 1
        command: ros2 launch jugglebot jugglebot_launch.py 2>&1 | tee -i ../temp/logs/launch_2026-11-13_3.log
      - where: Hands
        text: "Mocap must be tracking the robot base markers AND Ball Butler's Base markers for this launch: columns_turned picks the fed Site by Ball Butler's position. IDEA-22's first step, answering TKT-67, is already done (option 1: 3 degrees at Apex 0.90)."
    see: "BRIDGE_FW_CHECK: OK - can-bridge v43. homing: 7 axes homed."
    stop_if: The firmware check is not OK at v43, or fewer than 7 axes homed.
    record: The launch log path.
    serves:
      - item: IDEA-22
        do: [0, 1]

