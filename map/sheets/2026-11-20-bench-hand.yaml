schema: 1
date: "2026-11-20"
rig: bench-hand
steps:
  - n: 1
    kind: setup
    title: Check the checkout, with the launch down
    from: []
    to: []
    actions:
      - where: Hands
        text: "No launch may be running. Terminal 1 is the stage terminal for the whole sheet."
      - where: Terminal 1
        command: cd ~/Desktop/Jugglebot && source ~/Desktop/PDJ_venv/venv/bin/activate && git fetch && git status -sb && git log --oneline -1
    see: "## main...origin/main with nothing ahead or behind, and the top commit starts 'map: Sitting sheet 2026-11-20-bench-hand'. Untracked temp/learn/ entries are expected."
    stop_if: The branch is not main, or it is behind origin/main (wait two minutes for the auto-pull and run it again).
    serves: []

  - n: 2
    kind: setup
    title: Power the bench Hand and read its status
    from: []
    to: []
    actions:
      - where: Hands
        text: "Bench Hand on the bridge (CAN2, drive node 6). ODrive USB to the Jetson through the isolator, not the Win10 PC. Cup empty. E-stop in hand. Switch the 45 V supply on."
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py status
    see: "One line reading state 1 (IDLE), err 0x0, node 6, and vbus near 45 V. The same line gives the position as pos, in rev; every later status step reads it."
    stop_if: Any other node or state, or err not 0x0.
    record: The status line.
    serves:
      - {item: FEAT-45, do: [0]}

  - n: 3
    kind: setup
    title: Push-check the frame
    from: []
    to: []
    actions:
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py push-check
      - where: Hands
        text: "While it records, push the Hand DOWN slowly by a few cm, then let go."
    see: "A line ending PASS (DOWN counts negative)."
    stop_if: "FAIL: the mechanism or encoder is mirrored. Fly nothing else: go straight to step 19 (steps 13 to 18 are not flown either)."
    record: The push-check line.
    serves:
      - {item: FEAT-45, do: [1]}

  - n: 4
    kind: setup
    title: Torque-check, open loop
    from: []
    to: []
    actions:
      - where: Hands
        text: "Move the Hand by hand to mid-stroke, about 5 rev from either stop, and keep clear of it."
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py torque-check
      - where: Terminal 1
        text: "Only on FAIL, with the Hand at mid-stroke: python tests/hardware/bench_hand_frame_bench.py calibrate, then torque-check again."
    see: "It pulses 2 A down, then 4 A up, and prints TORQUE-CHECK PASS."
    stop_if: "It fails twice. Run no closed loop and fly nothing else. Go straight to step 19."
    record: The torque-check line, and whether calibrate was needed.
    serves:
      - {item: FEAT-45, do: [2]}

  - n: 5
    kind: setup
    title: Home onto the bottom stop
    from: []
    to: []
    actions:
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py home
    see: The Hand drives DOWN at 3 rev/s and ends IDLE on the bottom stop at -0.10 rev, printing HOME OK.
    stop_if: It moves up (press the E-stop), or the tool prints an abort.
    record: The home line.
    serves:
      - {item: FEAT-45, do: [3]}

  - n: 6
    kind: setup
    title: Measure the top stop, then park low
    from: []
    to: []
    actions:
      - where: Hands
        text: "With the drive IDLE, lift the Hand slowly onto the top stop and hold it there."
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py status
      - where: Hands
        text: "Write the position down: it is <measured> in steps 10 and 11. Lower the Hand to between 0.3 and 0.7 rev and run status again to check."
    see: A top stop near 10.4 rev, then a park position between 0.3 and 0.7 rev.
    stop_if: The top stop reads below 10.08 rev (rung C needs that much). Do step 7, then skip to step 13, which needs only 6.0 rev.
    record: The measured top stop in rev.
    serves:
      - {item: FEAT-45, do: [4]}

  - n: 7
    kind: setup
    title: Re-flash the bridge to clear the power-up latch
    from: []
    to: [bridge-cycled]
    actions:
      - where: Terminal 1
        command: cd ros_ws/src/jugglebot/Teensy_code_canbridge
      - where: Terminal 1
        command: pio run -e teensy41 -t upload
      - where: Terminal 1
        command: cd ~/Desktop/Jugglebot
      - where: Terminal 1
        text: "Then run python tests/hardware/bench_hand_frame_bench.py status once more."
    see: "SUCCESS from the upload, then status reading state 1, err 0x0 and pos between 0.3 and 0.7 rev. This flashes can-bridge v46, the version the bridge already runs; rungs B and C last flew on v43."
    stop_if: The upload fails (run the upload line again on its own), or status shows an error or a position outside 0.3 to 0.7 rev (repeat steps 5 to 7).
    serves:
      - {item: FEAT-45, do: [5]}

  - n: 8
    kind: setup
    title: Scope self-check
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Hands
        text: "Keep the Hand still, parked where step 6 left it."
      - where: Terminal 1
        command: python tools/probes/hand_foc_scope.py probe --label bench
    see: GO.
    stop_if: "NO-GO. Skip steps 9 to 12 and go to step 13: the BUG-105 row does not need the scope."
    record: The GO line.
    serves:
      - {item: FEAT-45, do: [6]}

  - n: 9
    kind: setup
    title: Arm the fault capture in a second terminal
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Terminal 2
        command: cd ~/Desktop/Jugglebot && source ~/Desktop/PDJ_venv/venv/bin/activate
      - where: Terminal 2
        command: python tools/probes/hand_foc_scope.py capture --preset power --trigger fault --save-clean --label bench_vol
    see: "It prints a line starting 'armed: preset power, trigger fault' and then waits. It has no timeout: leave it running until step 12. It saves a window tagged _clean each time the drive leaves closed loop without a fault, and re-arms."
    stop_if: It exits or prints a traceback three times in a row. Go on without it only if you accept that a fault will not be captured.
    record: Whether the capture armed, or was skipped.
    serves:
      - {item: FEAT-45, do: [7]}

  - n: 10
    kind: run
    title: One rung C brake first
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --stage stroke_cut --close-loop --top-stop <measured> --repeat 1 --stroke-peak-vel 108 --cut-at-vel 103 --stroke-accel 2300 --stroke-top 8.3
      - where: Terminal 1
        text: "Replace <measured> with the top stop from step 6. The stage prints its plan (entry speed about 122 rev/s, bench stop needed about 10.08 rev) and refuses before it energises if the plan does not fit."
      - where: Terminal 2
        text: "After the stage ends, look here without typing: did it save a window, and does the name end _clean or _clean_forced?"
    see: "One fast upstroke, a hard stop near the top, a gentle return, then PASS on S1 to S5 with fault NONE."
    stop_if: "The bench stop needed is above <measured>, the run is not PASS, or there is a fault. On a fault follow the stop rule in step 11. Never press Ctrl-C on the stage mid-stroke; the E-stop is the stop."
    record: "The plan lines and the verdict line. Whether Terminal 2 saved a window after the stage exit, and its name (_clean or _clean_forced), or that it saved nothing."
    serves:
      - {item: FEAT-45, do: [8]}

  - n: 11
    kind: run
    title: "Volume run: 150 rung C brakes in one run"
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --stage stroke_cut --close-loop --top-stop <measured> --repeat 150 --stroke-peak-vel 108 --cut-at-vel 103 --stroke-accel 2300 --stroke-top 8.3
      - where: Terminal 1
        text: "Replace <measured> as in step 10, and type yes at the ARM prompt. The run takes about 8 minutes, about 3 s per brake. Before each brake it prints 'run N of 150' with the motor and FET temperatures, and after it a verdict line. It stops by itself at the first brake that is not PASS, the first fault and the first sched_refused above 0, and always ends with a TALLY line. It cannot pause: the E-stop is the stop."
      - where: Hands
        text: "Watch the temperatures on the run lines (0.0 for both means the drive does not report them). When the run has ended, touch the motor. Stop if it is too hot to keep a hand on."
      - where: Terminal 2
        text: "AT THE FIRST FAULT: leave this terminal alone until it prints the saved path (up to about 5 s). Only then, in Terminal 1: python tests/hardware/hand_stream_bench.py --clear-errors (the Item's recovery, hand_stream_bench.py --clear-errors). In one long run the drive stays in closed loop between brakes, so expect at most one _clean window, after the stage exits."
    see: "Run lines counting up to 150, each brake PASS with fault NONE and sched_refused 0, and a last line reading 'TALLY: 150 of 150 brakes flown, all PASS'."
    stop_if: "The stage stops itself on a brake not PASS, a fault or a sched_refused above 0, and its TALLY line names the run. Press the E-stop for a new noise or a temperature you do not like. A fault with a saved window is the result this row is looking for, not a failure: go to step 12. Never press Ctrl-C on the stage mid-stroke. If the drive restarts (power cycle), repeat step 5, park at 0.3 to 0.7 rev, and repeat step 7 before anything else."
    record: "The TALLY line and the last run line's temperatures. For a fault: the run number, the stage's ABORT line, and the saved path Terminal 2 printed. Anything heard or felt. Type pending: the verdict is computed at the debrief."
    serves:
      - {item: FEAT-45, do: [9, 10], pass: true}

  - n: 12
    kind: restore
    title: Stop the capture and park for the next row
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Terminal 2
        text: "Press Ctrl-C once on the capture (skip this if it was never armed). This is safe at any time."
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py status
      - where: Terminal 1
        text: "If it shows an error, run python tests/hardware/hand_stream_bench.py --clear-errors. If the position is above 0.9 rev or there was a fault, run python tests/hardware/bench_hand_frame_bench.py home, then lift the Hand to between 0.3 and 0.7 rev."
    see: "err 0x0, and pos at or below 0.9 rev (the stage normally returns the Hand to where it started, 0.3 to 0.7 rev)."
    stop_if: An error will not clear. End the Sitting at step 19.
    record: "The names of the files the capture saved (ls -t temp/hand_foc_scope | head -20), and whether any name contains _forced."
    serves: []

  - n: 13
    kind: run
    title: "Feedforward offset: the stage cuts a 10 rev/s upward ramp"
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Hands
        text: "Check: launch down, Hand parked at or below 0.9 rev, Cup empty, E-stop in hand, and the top stop from step 6 is at or above 6.0 rev."
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --stage triangle --tri-span 4 --tri-speed 10 --tri-cut up --top-stop <measured> --close-loop
      - where: Terminal 1
        text: "Replace <measured> with the top stop from step 6 and type yes at the ARM prompt. Touch nothing else: the Hand ramps up 4 rev and back at 10 rev/s, and in the middle of the second upward ramp the stage cuts its own stream, the same as a Ctrl-C there. It waits 2 s and prints its tri-cut lines."
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py status
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --clear-errors
      - where: Terminal 1
        text: "Then, if status shows the Hand above 0.9 rev: python tests/hardware/bench_hand_frame_bench.py home, and lift the Hand to between 0.3 and 0.7 rev."
    see: "The tri-cut lines: the last knot sent, the firmware's last command, a settled position about 10 / 35 = 0.29 rev ABOVE the firmware's last command, drift near 0, and fault_state NONE. Status shows the same position."
    stop_if: "The stage refuses or prints an ABORT (do not change the command to get past it), the Hand keeps moving after the cut or drifts (press the E-stop), or a fault will not clear."
    record: "The tri-cut lines: ramp direction, last knot, the firmware's last command, settled position, the offsets, and any Guard or latch. The status line."
    serves:
      - {item: BUG-105, do: [0, 1, 2]}

  - n: 14
    kind: run
    title: "Feedforward offset: the stage cuts 20 rev/s ramps, one up and one down"
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --stage triangle --tri-span 4 --tri-speed 20 --tri-cut up --top-stop <measured> --close-loop
      - where: Terminal 1
        text: "Type yes at the ARM prompt. The stage cuts in the middle of the second upward ramp and prints its tri-cut lines. Then status, --clear-errors, and re-park at or below 0.9 rev, exactly as in step 13."
      - where: Hands
        text: "The downward cut uses a 6 rev span (its triangle reaches about 6.7 rev), so it needs the top stop from step 6 at or above 7.3 rev; the stage refuses before it energises otherwise. If the top stop is lower, skip the downward cut and record why."
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --stage triangle --tri-span 6 --tri-speed 20 --tri-cut down --top-stop <measured> --close-loop
      - where: Terminal 1
        text: "Type yes. The stage cuts in the middle of the second downward ramp and prints its tri-cut lines. Then status and --clear-errors again."
      - where: Hands
        text: "Do not go faster than --tri-speed 20 in this row. Last, after the second --clear-errors: press the E-stop button once, run status, and note whether it still replies and what vbus reads. Release the button afterwards. If the drive lost power its reference is lost, which no longer matters."
    see: "The settled position about 20 / 35 = 0.57 rev above the firmware's last command after the upward cut, and about 0.57 rev below it after the downward cut, drift near 0 and fault_state NONE both times."
    stop_if: "The Hand keeps moving after a cut or drifts (press the E-stop), a fault will not clear, or the stage refuses a cut (do not change the command to get past the refusal)."
    record: "For each cut the tri-cut lines: ramp direction, last knot, the firmware's last command, settled position, the offsets, any Guard or latch. What the E-stop button cuts. The bench top stop in rev. Type pending: the verdict is computed at the debrief."
    serves:
      - {item: BUG-105, do: [3, 4], pass: true, setup_waived: "the bench stage energises the Hand itself with --close-loop, so no earlier step arms it"}

  - n: 15
    kind: setup
    title: Check out the stall-guard branch and flash firmware 47
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Hands
        text: "Cup empty. The 45 V supply stays on. If the E-stop test in step 14 cut the drive's power, release the button and wait until status replies before going on."
      - where: Terminal 1
        command: git fetch && git checkout night-shift/2026-11-20-BUG-123 && git log --oneline -1
      - where: Terminal 1
        command: cd ros_ws/src/jugglebot/Teensy_code_canbridge
      - where: Terminal 1
        command: pio run -e teensy41 -t upload
      - where: Terminal 1
        command: cd ~/Desktop/Jugglebot
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py status
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --clear-errors
    see: "git says Switched to branch 'night-shift/2026-11-20-BUG-123' and the log line is 'feat(bench): hand_stream_bench --stage stall proves the FW 47 Hand stall guard on the bench Hand (BUG-123)'. SUCCESS from the upload. status reads state 1, err 0x0. The clear-errors line ends 'CLEAR_ERRORS OK — fault_state NONE.', which on this branch also proves the bridge runs firmware 47 (it aborts on any other version)."
    stop_if: "The checkout refuses (local changes: stop and ask), the upload fails twice, or clear-errors prints an ABORT naming a firmware version. Then skip to step 18 and restore main."
    record: The log line, and the clear-errors line.
    serves:
      - {item: BUG-123, do: [0]}

  - n: 16
    kind: run
    title: "Stall-guard proof: push the Hand into the bottom stop until the guard cuts it"
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py home
      - where: Hands
        text: "With the drive IDLE, lift the Hand by hand to between 0.3 and 0.7 rev and let go."
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py status
      - where: Hands
        text: "Cup empty, nothing near the Hand, E-stop in hand. Touch the motor: it must be cool (the stage refuses at 50 C). The firmware never lets a streamed command go below 0 rev, so the stage moves the Hand's zero up by 0.65 rev for the push and puts it back afterwards; it also lowers the current limit to 45 A and puts back 70 A."
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --stage stall
      - where: Terminal 1
        text: "It prints a 'stall plan' line (firmware 47, limit 70 -> 45 A, frame shift +0.650 rev), then asks 'ARM stall ... [yes/NO]'. Type yes. The Hand closes the loop where it is, moves DOWN slowly (1 rev/s, about 1 s), meets the bottom stop, pushes for about a fifth of a second, and goes limp. Do not press Ctrl-C; the E-stop button is the stop."
      - where: Hands
        text: "When it has finished, touch the motor and say whether it is warm."
    see: "Lines in this order: 'current limit lowered: drive reads 45.0 A over USB', 'frame shifted +0.650 rev', 'ARMED: ramp ...', 'trip seen at t=...', 'HAND_MOVE_TO while latched: refused: ERR_BUS_DOWN', 'current limit restore: sent 70.0 A, drive reads 70.0 A over USB -> OK', 'encoder frame restored: Hand reads about -0.10 rev', a motor temperature line, and last 'STALL-GUARD PASS: IDLE <t> ms after the first 40 A sample (limit 200), peak <A> A, fault HAND_STALL, bit3 set'. Expect t about 150 to 180 and a peak near 45 A. The Hand stays limp on the stop. The fault stays latched until the next step."
    stop_if: "The Hand moves UP, keeps pushing for more than about a second, or makes a new noise: press the E-stop button. An 'ABORT: stall stage refused' list: fix what it names (park position, temperature, a fault: run --clear-errors) and run the stage again; nothing was commanded. A 'STALL-GUARD FAIL' line: do NOT repeat the stage; record it, run python tests/hardware/hand_stream_bench.py --clear-errors once, and go to step 18. A line containing 'NOT RESTORED: power-cycle the drive': switch the 45 V supply off and on, then home before anything else. A line containing 're-home before anything else': run the home command above before anything else."
    record: "The whole stage output from 'stall plan' to the verdict line (save it with the terminal's copy, or re-run nothing). Whether the motor was warm. Anything heard or felt during the push."
    serves:
      - {item: BUG-123, do: [1], pass: true}

  - n: 17
    kind: run
    title: "Stall-guard repeats: two more trips, only after a PASS"
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Hands
        text: "Only if step 16 printed STALL-GUARD PASS and the motor is not warm. Otherwise run the first command below once and go to step 18."
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --clear-errors
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py home
      - where: Hands
        text: "Lift the Hand to between 0.3 and 0.7 rev and let go, then check with status."
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py status
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --stage stall
      - where: Terminal 1
        text: "Type yes at the ARM prompt. Then repeat this step's four commands once more (clear-errors, home, park, status, stage) for the third trip, and finish with python tests/hardware/hand_stream_bench.py --clear-errors."
      - where: Hands
        text: "Touch the motor before each repeat. Stop the repeats if it is warm."
    see: "Each run ends with STALL-GUARD PASS, now with 'bit3 set (already set before this run)': only a reboot or a Hand ladder clears bit3, so the stage times these trips on the current, the fault and the axis state. The clear-errors lines end 'CLEAR_ERRORS OK — fault_state NONE.'."
    stop_if: "Any STALL-GUARD FAIL, a warm motor, or a new noise: stop the repeats, run --clear-errors once, and go to step 18. The step 16 stop rules apply to every run."
    record: "Each run's verdict line and its 'current limit restore' line. How many trips in all (step 16 included). Motor warmth after the last."
    serves:
      - {item: BUG-123, do: [2]}

  - n: 18
    kind: restore
    title: Back to main and flash the bridge back
    from: [bridge-cycled]
    to: [bridge-cycled]
    actions:
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py status
      - where: Terminal 1
        command: git checkout main && git log --oneline -1
      - where: Terminal 1
        command: cd ros_ws/src/jugglebot/Teensy_code_canbridge
      - where: Terminal 1
        command: pio run -e teensy41 -t upload
      - where: Terminal 1
        command: cd ~/Desktop/Jugglebot
      - where: Terminal 1
        command: python tests/hardware/hand_stream_bench.py --clear-errors
    see: "status: state 1, err 0x0. git: Switched to branch 'main'. SUCCESS from the upload: the bridge runs can-bridge v46 again, which the robot's main expects until this branch lands. clear-errors ends 'CLEAR_ERRORS OK — fault_state NONE.' (on main it aborts on any version but 46)."
    stop_if: "The upload fails twice: leave the bench powered and tell the debrief the bridge may still run firmware 47; the robot must not be launched on it. clear-errors aborts naming a version: flash again."
    record: The clear-errors line.
    serves:
      - {item: BUG-123, do: [3]}

  - n: 19
    kind: restore
    title: Leave the bench safe
    from: [bridge-cycled]
    to: []
    actions:
      - where: Terminal 1
        command: python tests/hardware/bench_hand_frame_bench.py status
      - where: Hands
        text: "Check Terminal 2 is back at a prompt. Switch the 45 V supply off. Cup empty."
    see: "state 1 (IDLE) and err 0x0 before the supply goes off. If the E-stop test in step 14 cut the drive's power, status may not reply at all: that is fine, switch off."
    stop_if: "The drive reads state 8 (closed loop). Run python tests/hardware/hand_stream_bench.py --clear-errors and check again before switching off."
    serves: []
