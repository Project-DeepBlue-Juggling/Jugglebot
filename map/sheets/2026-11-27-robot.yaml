schema: 1
date: '2026-11-27'
rig: robot
omitted:
- item: BUG-111
  reason: needs the paired emit-lead Sitting on sitting/emit-lead-1 (150 min); not chosen for this Sitting
- item: BUG-122
  reason: its fix is still on a held branch and its section names no branch; not chosen for this Sitting
- item: BUG-58
  reason: not chosen for this Sitting (40 min, two extra launches)
- item: BUG-78
  reason: not chosen for this Sitting
- item: BUG-89
  reason: not chosen for this Sitting (40 min, two extra launches)
- item: FEAT-32
  reason: not chosen for this Sitting
- item: FEAT-39
  reason: not chosen for this Sitting
- item: FEAT-68
  reason: not chosen for this Sitting (60 min)
- item: BUG-144
  reason: its fix is on a Night Shift branch that this sheet does not build
- item: BUG-95
  reason: not chosen for this Sitting
- item: FEAT-49
  reason: waits on FEAT-45 rungs B and C
- item: FEAT-50
  reason: its WARN is on an unmerged branch; not chosen for this Sitting
steps:
- n: 1
  kind: setup
  title: Check the checkout is on main and in sync
  from: []
  to: []
  actions:
  - where: Terminal 2
    command: cd ~/Desktop/Jugglebot && git fetch && git status -sb && git log --oneline -1
  - where: Terminal 2
    command: cd ~/Desktop/Jugglebot/ros_ws && source /opt/ros/foxy/setup.zsh && colcon build --packages-select jugglebot_interfaces jugglebot && source install/setup.zsh && cd ~/Desktop/Jugglebot
    text: Build main, so the launch runs what the checkout holds.
  see: '''## main...origin/main'' with nothing ahead or behind. temp/ entries showing as untracked are expected. The build ends ''Summary: 2 packages finished''.'
  stop_if: The branch is not main, or it is ahead of or behind origin/main. Do not go on; tell a Session.
  serves: []
- n: 2
  kind: run
  title: 'Launch 1 (main, can-bridge v53): the first powered launch on this firmware'
  new_launch: true
  from: []
  to:
  - launched
  - bridge-cycled
  actions:
  - where: Hands
    text: 'Platform down on its stops, Cup empty, Ball Butler off. Power-cycle the can-bridge. Then drive power ON (48 V) and the E-stop button released. Keep a hand near the E-stop button for this whole launch: this firmware has never run with motor power.'
  - where: Terminal 1
    command: cd ~/Desktop/Jugglebot/ros_ws && source /opt/ros/foxy/setup.zsh && source install/setup.zsh && ros2 launch jugglebot jugglebot_launch.py cpu_partition:=false 2>&1 | tee -i ~/Desktop/Jugglebot/temp/logs/launch_2026-11-27_1.log
  - where: Hands
    text: Wait for Homing to finish before the next step.
  - where: Terminal 2
    command: source /opt/ros/foxy/setup.zsh && source ~/Desktop/Jugglebot/ros_ws/install/setup.zsh && cd ~/Desktop/Jugglebot
    text: 'Terminal 2 for every later command: source it once now.'
  - where: Terminal 2
    command: grep -n "BRIDGE_FW_CHECK\|PLATFORM_FW_CHECK" ~/Desktop/Jugglebot/temp/logs/launch_2026-11-27_1.log
  - where: Terminal 2
    command: timeout 5 ros2 topic echo /link_status | grep -A1 -E "legs_held|rig_bench"
    text: Foxy has no echo --once; the timeout ends it. Each key prints with its value on the next line.
  - where: Terminal 2
    command: timeout 3 ros2 topic echo /robot_state | grep pos_estimate | head -7
    text: 'Seven lines: the six Legs on their stops after Homing, then the Hand (rev).'
  see: 'BRIDGE_FW_CHECK: OK - can-bridge v53. PLATFORM_FW_CHECK: OK - Platform Teensy v15. homing: 7 axes homed. legs_held reads none and rig_bench reads 0. The first six positions (the Legs) read about -0.10 rev; the seventh is the Hand and is not judged.'
  stop_if: 'Either firmware check is not OK, fewer than 7 axes homed, rig_bench reads 1, legs_held is not none, or a node dies or logs a start-up error you have not seen before: Ctrl-C the launch and tell a Session. A Leg position below -0.11 rev is a result, not a stop: note it.'
  record: The bag directory (the newest folder under ~/Desktop/rosbags) and the pos_estimate values printed.
  serves:
  - item: FEAT-69
    do:
    - 0
- n: 3
  kind: run
  title: 'Level the Platform: the first rise and descent on can-bridge v53'
  from:
  - launched
  - bridge-cycled
  to:
  - launched
  - level
  - bridge-cycled
  actions:
  - where: Hands
    text: Stand clear of the Platform with a hand on the E-stop button.
  - where: GUI
    text: 'State minimap: hold LEVELLING to confirm. The Platform rises to full Active height.'
  - where: Terminal 2
    command: grep -n "levelled:" ~/Desktop/Jugglebot/temp/logs/launch_2026-11-27_1.log
  see: 'The rise starts a fraction of a second after the hold (the firmware now waits for every Leg to confirm Closed-loop before it moves any). LEVELLING finishes with no Fault and the grep prints one ''levelled: ...'' line.'
  stop_if: 'A refused or failed rise or descent is the result this step exists to find: note the notice and the launch log text word for word, hold IDLE if the Platform is up and holding, then go to step 8. FW 53 never makes a Leg Idle above Stow. If a Leg goes limp or the Platform tilts or sags while it is up: support the Platform and press the E-stop button, then Ctrl-C the launch and tell a Session.'
  serves:
  - item: FEAT-69
    do:
    - 1
- n: 4
  kind: run
  title: Activate (this arms) and hold the Active pose
  from:
  - launched
  - level
  - bridge-cycled
  to:
  - launched
  - level
  - armed
  - bridge-cycled
  actions:
  - where: GUI
    text: 'State minimap: hold ACTIVE:TRAJECTORY to confirm. The launch''s auto_arm arms on entry. Cup empty.'
  - where: Terminal 2
    command: timeout 5 ros2 topic echo /link_status | grep -A1 -E "legs_held|rig_bench"
  see: Mode ACTIVE:TRAJECTORY, Armed, no Fault. legs_held reads none and rig_bench reads 0.
  stop_if: 'Any refusal or Fault on activation: note the text word for word, hold IDLE if the Platform is up and holding, then go to step 8. FW 53 never makes a Leg Idle above Stow. If a Leg goes limp or the Platform tilts or sags while it is up: support the Platform and press the E-stop button, then Ctrl-C the launch and tell a Session.'
  serves:
  - item: FEAT-69
    do:
    - 1
- n: 5
  kind: run
  title: 'Ask for a drive reboot at the Active pose: it must be refused'
  from:
  - launched
  - level
  - armed
  - bridge-cycled
  to:
  - launched
  - level
  - armed
  - bridge-cycled
  actions:
  - where: Terminal 2
    command: ros2 service call /reboot_odrives std_srvs/srv/Trigger
    text: One call only. Do not disarm first.
  see: 'The reply reads success=False and its message starts ''reboot_odrives REFUSED: the robot is Armed''. Nothing moves and the Platform keeps holding the Active pose.'
  stop_if: 'The reply reads success=True, or any Leg goes limp: support the Platform and press the E-stop button, then Ctrl-C the launch and tell a Session. This is the failure the firmware exists to prevent.'
  record: The refusal text.
  serves:
  - item: FEAT-69
    do:
    - 3
- n: 6
  kind: run
  title: Deactivate, then read the Legs
  from:
  - launched
  - level
  - armed
  - bridge-cycled
  to:
  - launched
  - level
  - bridge-cycled
  actions:
  - where: GUI
    text: 'State minimap: hold IDLE to confirm (safe teardown, disarms). Wait until the Platform is down and the Mode reads IDLE before the reads below.'
  - where: Terminal 2
    command: timeout 3 ros2 topic echo /robot_state | grep disarm_reason | head -7
  - where: Terminal 2
    command: timeout 3 ros2 topic echo /robot_state | grep current_state | head -7
    text: 1 is Idle, 8 is Closed-loop.
  - where: Terminal 2
    command: timeout 5 ros2 topic echo /link_status | grep -A1 -E "legs_held|rig_bench"
  see: The Platform descends to Stow under profile and only then do the Legs go Idle. disarm_reason reads 0 on every line, current_state reads 1, legs_held reads none.
  stop_if: 'A refused or failed deactivate, or a Leg left holding (legs_held names it): note the text, hold IDLE once more; if the Platform stays up, support it and press the E-stop button, then go to step 8. FW 53 never makes a Leg Idle above Stow. If a Leg goes limp or the Platform tilts or sags while it is up: support the Platform and press the E-stop button, then Ctrl-C the launch and tell a Session.'
  record: The disarm_reason and current_state values printed, and any Leg named by legs_held.
  serves:
  - item: FEAT-69
    do:
    - 1
    - 2
    reorder: the reboot step asks for its refusal at the Active pose, before this deactivate
- n: 7
  kind: run
  title: 'Ask for the drive reboot again at Stow: it must be accepted (last act of this launch)'
  from:
  - launched
  - level
  - bridge-cycled
  to:
  - launched
  - bridge-cycled
  actions:
  - where: Hands
    text: Platform down at Stow, Mode IDLE. Do not hold any mode button during this step.
  - where: Terminal 2
    command: ros2 service call /reboot_odrives std_srvs/srv/Trigger
  - where: GUI
    text: Watch the state minimap for one minute and write down each state it shows.
  see: The reply reads success=True. The drives reboot, which clears the homed flag and the levelling. The robot may show FAULT, then BOOT, and may start Homing by itself with the Platform down; that is allowed.
  stop_if: 'The reply is a refusal at Stow: note the text, that is a result. Never hold LEVELLING or ACTIVE after this step in this launch: the robot is no longer homed. If Homing starts, let it finish before step 8.'
  record: 'The reply text and the states the minimap showed. Type ''pending'' if asked: the engage times are read from the bag at the debrief.'
  serves:
  - item: FEAT-69
    do:
    - 3
    pass: true
- n: 8
  kind: restore
  title: End launch 1
  from:
  - launched
  - bridge-cycled
  to: []
  actions:
  - where: GUI
    text: If the Platform is up, hold IDLE to confirm and wait for Stow. If Homing is running, wait for it to end.
  - where: Terminal 1
    text: Ctrl-C the launch and wait for the shell prompt.
  see: The Platform is at Stow and no Homing is running at the Ctrl-C. The bag closes.
  stop_if: 'A Fault blocks the teardown: clear it as you usually do before the Ctrl-C. If step 3, 4 or 6 failed, stop the Sitting here and tell a Session: every later step needs a working activate and deactivate.'
  serves: []
- n: 9
  kind: run
  title: Launch 2 (main)
  new_launch: true
  from: []
  to:
  - launched
  actions:
  - where: Hands
    text: Cup empty, Ball Butler off. Mocap on and tracking the robot. Drive power ON, E-stop button released.
  - where: Terminal 1
    command: cd ~/Desktop/Jugglebot/ros_ws && source /opt/ros/foxy/setup.zsh && source install/setup.zsh && ros2 launch jugglebot jugglebot_launch.py cpu_partition:=false 2>&1 | tee -i ~/Desktop/Jugglebot/temp/logs/launch_2026-11-27_2.log
  - where: Hands
    text: Wait for Homing to finish before the next step.
  - where: Terminal 2
    command: grep -n "BRIDGE_FW_CHECK\|PLATFORM_FW_CHECK\|Ball tracker up" ~/Desktop/Jugglebot/temp/logs/launch_2026-11-27_2.log
  see: 'BRIDGE_FW_CHECK: OK - can-bridge v53. PLATFORM_FW_CHECK: OK - Platform Teensy v15. homing: 7 axes homed. The ''Ball tracker up'' line shows gravity_world_xy=(0.0, 0.0) mm/s^2. The GUI IMU panel reads ''recording''.'
  stop_if: 'Either firmware check is not OK, fewer than 7 axes homed, or a node dies: Ctrl-C the launch and tell a Session. The tracker line shows a gravity value other than (0.0, 0.0): note it and skip steps 18 and 19.'
  record: The bag directory (the newest folder under ~/Desktop/rosbags).
  serves:
  - item: IDEA-16
    do:
    - 0
- n: 10
  kind: run
  title: Level the Platform, then rehearse (nothing moves)
  from:
  - launched
  to:
  - launched
  - level
  actions:
  - where: GUI
    text: 'State minimap: hold LEVELLING to confirm. The Platform rises to full Active height.'
  - where: Terminal 2
    command: grep -n "levelled:" ~/Desktop/Jugglebot/temp/logs/launch_2026-11-27_2.log
  - where: Terminal 2
    command: 'ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString "{data: ''oval_1ball_fed,apex_m=1.00,separation_mm=150.0,dwell_s=0.50''}"'
    text: One-ball oval at Dwell 0.50 (step 15).
  - where: Terminal 2
    command: 'ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString "{data: ''oval_1ball_fed,apex_m=1.00,separation_mm=150.0,dwell_s=0.40''}"'
    text: 'The same oval at Dwell 0.40 (step 16). A refusal here is a result for IDEA-27: write it down and skip steps 16 and 17.'
  - where: Terminal 2
    command: 'ros2 service call /skills/nominate jugglebot_interfaces/srv/SetString "{data: ''columns,apex_m=0.95,separation_mm=125,dwell_s=0.27''}"'
    text: Columns (steps 18 and 19).
  see: 'LEVELLING finishes with no Fault and the grep prints one ''levelled: ...'' line. Each nominate reply reads success: True with no refusal line and nothing moves.'
  stop_if: 'Any Fault, a refused or failed rise, or the Platform ends visibly not level: hold IDLE, Ctrl-C the launch and tell a Session. FW 53 never makes a Leg Idle above Stow. If a Leg goes limp or the Platform tilts or sags while it is up: support the Platform and press the E-stop button, then Ctrl-C the launch and tell a Session. A nominate reply with success: False is not a stop: note it word for word and skip the Attempts that use that setting.'
  serves:
  - item: IDEA-16
    do:
    - 0
  - item: IDEA-27
    do:
    - 0
- n: 11
  kind: run
  title: Lob about 30 single Balls at the Cup (not armed)
  from:
  - launched
  - level
  to:
  - launched
  - level
  actions:
  - where: Hands
    text: Do NOT activate. Cup empty. The Platform stays where the Level left it.
  - where: Terminal 2
    command: ros2 param set /ball_tracker_node detect_human_throws true
  - where: Hands
    text: From where you would stand to juggle with the robot, lob one Ball at the Cup about 30 times, one Ball in the air at a time, peaking at about 1.8 m or more. Let each Ball land in or beside the Cup and pick it up by hand before the next.
  - where: Terminal 2
    command: ros2 param set /ball_tracker_node detect_human_throws false
  - where: Terminal 2
    command: ros2 param get /ball_tracker_node detect_human_throws
  see: Each set prints 'Set parameter successful'. The final read prints False. Nothing on the robot moves.
  stop_if: 'The final read is not False: send the set again. Anything on the robot moves: press the E-stop button, Ctrl-C the launch and tell a Session.'
  record: 'Where you stood and the lob count. Type ''pending'' if asked: the replay runs at the debrief.'
  serves:
  - item: IDEA-16
    do:
    - 1
    - 2
    - 3
    pass: true
- n: 12
  kind: run
  title: Plumb line at two places, and the floor level (not armed)
  from:
  - launched
  - level
  to:
  - launched
  - level
  actions:
  - where: Hands
    text: Hang a weighted line carrying two Mocap markers at least 800 mm apart near the Cup. Wait for the swing to stop, then leave it still for 10 s by the clock and note the clock time (the bag is already recording Mocap).
  - where: Hands
    text: 'Move the line about 500 mm away, near Ball Butler, and do the same: still for 10 s, note the clock time.'
  - where: Hands
    text: Put a digital level on the floor where the Mocap L-frame was placed and read both axes. Take the line away.
  see: Both markers of the line show in the Mocap view at each place.
  stop_if: 'A marker of the line is not tracked: move the line until both are, and note where it ended up. Skip this step if there is no line to hang; steps 18 and 19 can still be flown.'
  record: The two clock times, the floor level in both axes, and whether Mocap was recalibrated since 2026-11-13.
  serves:
  - item: FEAT-27
    do:
    - 0
    - 1
    - 2
- n: 13
  kind: setup
  title: Activate (this arms) and hold the Active pose
  from:
  - launched
  - level
  to:
  - launched
  - level
  - armed
  actions:
  - where: Hands
    text: Cup empty, every lobbed Ball picked up, the plumb line taken away.
  - where: GUI
    text: 'State minimap: hold ACTIVE:TRAJECTORY to confirm. The launch''s auto_arm arms on entry.'
  see: Mode ACTIVE:TRAJECTORY, Armed, no Fault.
  stop_if: 'Any refusal or Fault on activation: note the text, clear it as you usually do; if it will not clear, do the stand-down step of this launch. FW 53 never makes a Leg Idle above Stow. If a Leg goes limp or the Platform tilts or sags while it is up: support the Platform and press the E-stop button, then Ctrl-C the launch and tell a Session. After any Hand MISSING_ESTIMATE or E-stop button press the Hand must be re-homed before it moves again (BUG-122): stop flying, do the stand-down step of this launch and go on from the step after it (the next launch re-homes).'
  serves: []
- n: 14
  kind: setup
  title: Bring up Ball Butler
  from:
  - launched
  - level
  - armed
  to:
  - launched
  - level
  - armed
  - bb-fed
  actions:
  - where: Hands
    text: Power Ball Butler, calibrate it as you usually do, and load it. Cup empty. Reach into the Cup only when the Platform holds still in the Active pose.
  see: Ball Butler powered and holding a ball. Mode still ACTIVE:TRAJECTORY, Armed, no Fault.
  stop_if: 'Any refusal or Fault: clear it as you usually do; if it will not clear, go to step 20. After any Hand MISSING_ESTIMATE or E-stop button press the Hand must be re-homed before it moves again (BUG-122): stop flying, do the stand-down step of this launch and go on from the step after it (the next launch re-homes).'
  serves: []
- n: 15
  kind: run
  title: One oval Attempt at Dwell 0.50 (8 Throws); the IMU upload starts by itself
  from:
  - launched
  - level
  - armed
  - bb-fed
  to:
  - launched
  - level
  - armed
  - bb-fed
  actions:
  - where: Hands
    text: Cup empty, Ball Butler loaded. Note the clock time.
  - where: Terminal 2
    command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.50, num_cycles: 8}" --feedback'
    text: The goal holds Terminal 2 until it reports its outcome; Ctrl-C there cancels the Attempt.
  - where: GUI
    text: 'IMU panel: ''uploading ...'' when the Attempt ends, then ''recording''. Wait for it.'
  - where: Hands
    text: Empty the Cup while the Platform holds still.
  - where: Terminal 2
    command: grep -n "Platform IMU upload finished" ~/Desktop/Jugglebot/temp/logs/launch_2026-11-27_2.log | tail -1
  see: The outcome reads COMPLETED. The grep line carries a fresh clock time and ends 'complete yes, crc ok'.
  stop_if: 'An outcome other than COMPLETED: note it word for word; fly the goal once more if the Hand and Platform looked normal. A jerky Platform, a wrong-looking Hand stroke or a Leg base joint moving: Ctrl-C the goal and go to step 20. After any Hand MISSING_ESTIMATE or E-stop button press the Hand must be re-homed before it moves again (BUG-122): stop flying, do the stand-down step of this launch and go on from the step after it (the next launch re-homes).'
  record: Attempt start time and caught count. Type 'pending' if asked.
  serves:
  - item: BUG-132
    do:
    - 0
  - item: IDEA-25
    do:
    - 0
    pass: true
- n: 16
  kind: run
  title: One oval Attempt at Dwell 0.40 on its own plant (8 Throws)
  from:
  - launched
  - level
  - armed
  - bb-fed
  to:
  - launched
  - level
  - armed
  - bb-fed
  actions:
  - where: Hands
    text: Skip this step and step 17 if the Dwell 0.40 rehearsal in step 10 was refused. Load Ball Butler; Cup empty.
  - where: Terminal 2
    command: ros2 param set /skill_node plant_id ring-dwell040-2026-11-27
  - where: Terminal 2
    command: ros2 param get /skill_node plant_id
  - where: Terminal 2
    command: 'ros2 action send_goal /jugglebot/juggle jugglebot_interfaces/action/Juggle "{pattern: oval_1ball_fed, apex_m: 1.00, separation_mm: 150.0, dwell_s: 0.40, num_cycles: 8}" --feedback'
  - where: GUI
    text: 'IMU panel: wait for ''recording''.'
  - where: Hands
    text: Empty the Cup while the Platform holds still.
  see: The read-back prints ring-dwell040-2026-11-27. The Attempt reports an outcome and the IMU panel returns to 'recording'.
  stop_if: 'The read-back is not ring-dwell040-2026-11-27: do not fly; go to step 17. A jerky Platform or a Leg base joint moving: Ctrl-C the goal and go to step 17. After any Hand MISSING_ESTIMATE or E-stop button press the Hand must be re-homed before it moves again (BUG-122): stop flying, do the stand-down step of this launch and go on from the step after it (the next launch re-homes).'
  record: The caught count. The upload line is in the launch log.
  serves:
  - item: IDEA-27
    do:
    - 1
    - 2
    pass: true
- n: 17
  kind: restore
  title: Put the plant back
  from:
  - launched
  - level
  - armed
  - bb-fed
  to:
  - launched
  - level
  - armed
  - bb-fed
  actions:
  - where: GUI
    text: 'IMU panel: if it reads ''uploading'', wait for ''recording'' first.'
  - where: Terminal 2
    command: ros2 param set /skill_node plant_id jugglebot
  - where: Terminal 2
    command: ros2 param get /skill_node plant_id
  see: plant_id reads jugglebot.
  stop_if: 'It does not read jugglebot: send the set again; if it still does not, go to step 20 (every launch starts at jugglebot) and skip steps 18 and 19.'
  serves:
  - item: IDEA-27
    do:
    - 3
- n: 18
  kind: run
  title: 'Columns, gravity vector off: one Attempt'
  from:
  - launched
  - level
  - armed
  - bb-fed
  to:
  - launched
  - level
  - armed
  - bb-fed
  actions:
  - where: Hands
    text: 'Fly this whether or not step 12 was done: the lines are judged at the debrief. Load Ball Butler for Columns as you usually do. Cup empty.'
  - where: GUI
    text: 'Juggle panel: Columns, Sep. 125, Apex 0.95, Dwell 0.27, Throws 21. Send it.'
  - where: Hands
    text: When the Attempt has ended, empty the Cup while the Platform holds still.
  see: The Attempt runs as Columns has on recent Sittings.
  stop_if: 'A jerky Platform or a Leg base joint moving: cancel the goal and go to step 20. A short Attempt is not a stop: note the caught count. After any Hand MISSING_ESTIMATE or E-stop button press the Hand must be re-homed before it moves again (BUG-122): stop flying, do the stand-down step of this launch and go on from the step after it (the next launch re-homes).'
  record: Caught of thrown and the end code.
  serves:
  - item: FEAT-27
    do:
    - 3
- n: 19
  kind: run
  title: 'Columns, gravity vector on: at least 40 Throws'
  from:
  - launched
  - level
  - armed
  - bb-fed
  to:
  - launched
  - level
  - armed
  - bb-fed
  actions:
  - where: Terminal 2
    command: ros2 param set /ball_tracker_node gravity_world_xy_mmps2 "[43.0, 83.0]"
    text: Between Attempts only. Note the clock time.
  - where: Terminal 2
    command: grep -n "gravity_world_xy_mmps2 ->" ~/Desktop/Jugglebot/temp/logs/launch_2026-11-27_2.log | tail -1
  - where: GUI
    text: 'Juggle panel: Columns, Sep. 125, Apex 0.95, Dwell 0.27, Throws 21. Fly Attempts until at least 40 Throws have been made with the vector on (two full Attempts, or more short ones). Keep the Memory: do not change plant_id. Before each Attempt: IMU panel reads recording, Cup empty, Ball Butler loaded as for step 18.'
  see: The set prints 'Set parameter successful' and the grep line reads 'gravity_world_xy_mmps2 -> (43.0, 83.0)'. Catches are no worse than in step 18.
  stop_if: 'The set is refused: note the text and go to step 20. The landing error cannot be read live, so the vector stays on until the launch ends. Catches are clearly worse than in step 18 after two Attempts: stop flying and go to step 20 (the next launch starts with the vector off again). After any Hand MISSING_ESTIMATE or E-stop button press the Hand must be re-homed before it moves again (BUG-122): stop flying, do the stand-down step of this launch and go on from the step after it (the next launch re-homes).'
  record: 'The time of the param switch, caught of thrown per Attempt. Type ''pending'' if asked: the landing error and the re-aim counts are computed at the debrief.'
  serves:
  - item: FEAT-27
    do:
    - 4
    - 5
    pass: true
- n: 20
  kind: restore
  title: Stand down launch 2
  from:
  - launched
  - level
  - armed
  - bb-fed
  to: []
