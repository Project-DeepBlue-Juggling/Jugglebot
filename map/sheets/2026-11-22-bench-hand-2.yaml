schema: 1
date: '2026-11-22'
rig: bench-hand
omitted:
- item: BUG-105
  do:
  - 0
  - 1
  - 2
  reason: the 10 rev/s upward cut flew on sheet 2026-11-22-bench-hand (offset +0.284 rev against 0.286 expected); the bench preparation in do 0 is this sheet steps 1 to 3 and 7
steps:
- n: 1
  kind: setup
  title: Check the checkout, with the launch down
  from: []
  to: []
  actions:
  - where: Hands
    text: No launch may be running. Terminal 1 is the stage terminal for the whole sheet.
  - where: Terminal 1
    command: cd ~/Desktop/Jugglebot && source ~/Desktop/PDJ_venv/venv/bin/activate && git fetch && git status -sb && git log --oneline -1
  see: '## main...origin/main with nothing ahead or behind, and the top commit is a ''map:'' or ''docs(sitting):'' commit from tonight. Untracked temp/learn/ entries are expected.'
  stop_if: The branch is not main, or it is behind origin/main (wait two minutes for the auto-pull and run it again).
  serves: []
- n: 2
  kind: setup
  title: Power the bench Hand and read its status
  from: []
  to: []
  actions:
  - where: Hands
    text: Bench Hand on the bridge (CAN2, drive node 6). ODrive USB to the Jetson through the isolator, not the Win10 PC. Cup empty. E-stop in hand. Switch the 45 V supply on.
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py status
  see: One line reading state 1 (IDLE), err 0x0, node 6, and vbus near 45 V. The same line gives the position as pos, in rev; every later status step reads it.
  stop_if: Any other node or state, or err not 0x0.
  record: The status line.
  serves: []
- n: 3
  kind: setup
  title: Home onto the bottom stop, then park low
  from: []
  to: []
  actions:
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py home
  - where: Hands
    text: With the drive IDLE after the home, lift the Hand to between 0.3 and 0.7 rev and let go. The top stop is known (10.4 rev, measured 2026-11-20 and used on 2026-11-22), so it is not measured again.
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py status
  see: The Hand drives DOWN at 3 rev/s and ends IDLE on the bottom stop at -0.10 rev, printing HOME OK. Then status reads state 1, err 0x0 and pos between 0.3 and 0.7 rev.
  stop_if: It moves up (press the E-stop), or the tool prints an abort.
  record: The home line.
  serves: []
- n: 4
  kind: setup
  title: Check out the stall-guard branch and flash firmware 48
  from: []
  to:
  - bridge-cycled
  actions:
  - where: Hands
    text: Cup empty. The 45 V supply stays on.
  - where: Terminal 1
    command: git fetch && git checkout night-shift/2026-11-20-BUG-123 && git merge --ff-only origin/night-shift/2026-11-20-BUG-123 && git log --oneline -1
  - where: Hands
    text: 'Read the log line before going on: it must start 4c5e78ff. On 2026-11-22 the checkout silently used an old local copy of the branch (9e715165), which is why the stage crashed again; the merge --ff-only in the command above brings the local branch up to the pushed one.'
  - where: Terminal 1
    command: cd ros_ws/src/jugglebot/Teensy_code_canbridge
  - where: Terminal 1
    command: pio run -e teensy41 -t upload
  - where: Terminal 1
    command: cd ~/Desktop/Jugglebot
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py status
  - where: Terminal 1
    command: python tests/hardware/hand_stream_bench.py --clear-errors
  see: 'git says Switched to branch ''night-shift/2026-11-20-BUG-123'' (or Already on it), then Already up to date or Fast-forward, and the log line is ''4c5e78ff fix(bench): the stall stage accepts a drive with no motor thermistor (BUG-123)''. SUCCESS from the upload. status reads state 1, err 0x0 and pos between 0.3 and 0.7 rev. The clear-errors line ends ''CLEAR_ERRORS OK — fault_state NONE.'', which on this branch also proves the bridge runs firmware 48 (it aborts on any other version).'
  stop_if: 'The log line does not start 4c5e78ff, or the checkout or merge refuses: run git checkout main, then stop and ask, and flash nothing. The upload fails twice, or clear-errors prints an ABORT naming a firmware version: skip to step 7 and restore main.'
  record: The log line, and the clear-errors line.
  serves:
  - item: BUG-123
    do:
    - 0
- n: 5
  kind: run
  title: 'Stall-guard proof: push the Hand into the bottom stop until the guard cuts it'
  from:
  - bridge-cycled
  to:
  - bridge-cycled
  actions:
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py status
  - where: Hands
    text: 'The Hand must read between 0.3 and 0.7 rev with state 1 and err 0x0 (step 3 parked it). If not: python tests/hardware/bench_hand_frame_bench.py home, lift it to 0.3 to 0.7 rev, and run status again.'
  - where: Hands
    text: 'Cup empty, nothing near the Hand, E-stop in hand. Touch the motor: it must be cool (this drive reports no motor temperature, so the stage checks the FET temperature against 50 C and your hand is the motor check). The firmware never lets a streamed command go below 0 rev, so the stage moves the Hand''s zero up by 0.65 rev for the push and puts it back afterwards; it also lowers the current limit to 45 A and puts back 70 A.'
  - where: Terminal 1
    command: python tests/hardware/hand_stream_bench.py --stage stall
  - where: Terminal 1
    text: It prints a note that the drive reports no motor temperature and the FET value it checked, then a 'stall plan' line (firmware 48, limit 70.0 -> 45.0 A, frame shift +0.650 rev), then asks 'ARM stall ... [yes/NO]'. Type yes. The Hand closes the loop where it is, moves DOWN slowly (1 rev/s, about 1 s), meets the bottom stop, pushes for about a fifth of a second, and goes limp. Do not press Ctrl-C; the E-stop button is the stop.
  - where: Hands
    text: When it has finished, touch the motor and say whether it is warm.
  see: 'Lines in this order: ''current limit lowered: drive reads 45.0 A over USB'', ''frame shifted +0.650 rev'', ''ARMED: ramp ...'', ''trip seen at t=...'', ''HAND_MOVE_TO while latched: refused: ERR_BUS_DOWN'', ''current limit restore: sent 70.0 A, drive reads 70.0 A over USB -> OK'', ''encoder frame restored: Hand reads about -0.10 rev'', ''motor temperature not reported by this drive: touch the motor'', and last ''STALL-GUARD PASS: IDLE <t> ms after the first 40 A sample (limit 200), peak <A> A, fault HAND_STALL, bit3 set''. Expect t about 150 to 180 and a peak near 45 A. The Hand stays limp on the stop. The fault stays latched until the next step.'
  stop_if: 'The Hand moves UP, keeps pushing for more than about a second, or makes a new noise: press the E-stop button. An ''ABORT: stall stage refused'' list: fix what it names (park position, temperature, a fault: run --clear-errors) and run the stage again; nothing was commanded. A ''STALL-GUARD FAIL'' line: do NOT repeat the stage; record it, run python tests/hardware/hand_stream_bench.py --clear-errors once, and go to step 7. A line containing ''NOT RESTORED: power-cycle the drive'': switch the 45 V supply off and on, then home before anything else. A line containing ''re-home before anything else'': run the home command above before anything else. An ABORT naming firmware 47: the bridge still runs main''s build, which has no stall guard; repeat step 4.'
  record: The whole stage output from 'stall plan' to the verdict line (save it with the terminal's copy, or re-run nothing). Whether the motor was warm. Anything heard or felt during the push.
  serves:
  - item: BUG-123
    do:
    - 1
    pass: true
- n: 6
  kind: run
  title: 'Stall-guard repeats: two more trips, only after a PASS'
  from:
  - bridge-cycled
  to:
  - bridge-cycled
  actions:
  - where: Hands
    text: Only if step 5 printed STALL-GUARD PASS and the motor is not warm. Otherwise run the first command below once and go to step 7.
  - where: Terminal 1
    command: python tests/hardware/hand_stream_bench.py --clear-errors
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py home
  - where: Hands
    text: Lift the Hand to between 0.3 and 0.7 rev and let go, then check with status.
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py status
  - where: Terminal 1
    command: python tests/hardware/hand_stream_bench.py --stage stall
  - where: Terminal 1
    text: Type yes at the ARM prompt. Then repeat the whole sequence once more (clear-errors, home, park, status, stage) for the third trip, and finish with python tests/hardware/hand_stream_bench.py --clear-errors.
  - where: Hands
    text: Touch the motor before each repeat. Stop the repeats if it is warm.
  see: 'Each run ends with STALL-GUARD PASS, now with ''bit3 set (already set before this run)'': only a reboot or a Hand ladder clears bit3, so the stage times these trips on the current, the fault and the axis state. The clear-errors lines end ''CLEAR_ERRORS OK — fault_state NONE.''.'
  stop_if: 'Any STALL-GUARD FAIL, a warm motor, or a new noise: stop the repeats, run --clear-errors once, and go to step 7. The step 5 stop rules apply to every run.'
  record: Each run's verdict line and its 'current limit restore' line. How many trips in all (step 5 included). Motor warmth after the last.
  serves:
  - item: BUG-123
    do:
    - 2
- n: 7
  kind: restore
  title: Back to main and flash the bridge back
  from:
  - bridge-cycled
  to:
  - bridge-cycled
  actions:
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py status
  - where: Terminal 1
    command: git checkout main && git log --oneline -1
  - where: Hands
    text: 'Go on only if git printed Switched to branch ''main'' (or Already on ''main''). If the checkout refused, stop and ask: flashing now would put the branch''s firmware 48 back on the bridge.'
  - where: Terminal 1
    command: cd ros_ws/src/jugglebot/Teensy_code_canbridge
  - where: Terminal 1
    command: pio run -e teensy41 -t upload
  - where: Terminal 1
    command: cd ~/Desktop/Jugglebot
  - where: Terminal 1
    command: python tests/hardware/hand_stream_bench.py --clear-errors
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py home
  - where: Hands
    text: Lift the Hand to between 0.3 and 0.7 rev and let go, then run python tests/hardware/bench_hand_frame_bench.py status to check.
  see: 'status: state 1 (IDLE); a latched HAND_STALL from the last trip may still show here and is cleared by the clear-errors command below. git: Switched to branch ''main''. SUCCESS from the upload: the bridge runs can-bridge v47 again, which the robot''s main expects until this branch lands. clear-errors ends ''CLEAR_ERRORS OK — fault_state NONE.'' (on main it aborts on any version but 47). Then HOME OK, and status reads pos between 0.3 and 0.7 rev.'
  stop_if: 'The upload fails twice: leave the bench powered and tell the debrief the bridge may still run firmware 48; the robot must not be launched on it. clear-errors aborts naming a version: flash again.'
  record: The clear-errors line.
  serves:
  - item: BUG-123
    do:
    - 3
- n: 8
  kind: run
  title: 'Feedforward offset: the stage cuts 20 rev/s ramps, down and then up'
  from:
  - bridge-cycled
  to:
  - bridge-cycled
  actions:
  - where: Hands
    text: Launch down, Hand parked at or below 0.9 rev, Cup empty, E-stop in hand. The top stop is 10.4 rev, already written into both commands.
  - where: Terminal 1
    command: python tests/hardware/hand_stream_bench.py --stage triangle --tri-span 6 --tri-speed 20 --tri-cut down --top-stop 10.4 --close-loop
  - where: Terminal 1
    text: 'Type yes at the ARM prompt and touch nothing else. The Hand holds still while the firmware hands it back, ramps 6 rev up and down at 20 rev/s, and in the middle of the second downward ramp the stage cuts its own stream. It waits 2 s and prints its tri-cut lines. After a cut at this speed the Hand can run on about 2 rev before it stops: that is the firmware''s own wind-down and was seen on 2026-11-22.'
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py status
  - where: Terminal 1
    command: python tests/hardware/hand_stream_bench.py --clear-errors
  - where: Terminal 1
    text: 'If status showed the Hand above 0.9 rev: python tests/hardware/bench_hand_frame_bench.py home, then lift the Hand to between 0.3 and 0.7 rev.'
  - where: Terminal 1
    command: python tests/hardware/hand_stream_bench.py --stage triangle --tri-span 4 --tri-speed 20 --tri-cut up --top-stop 10.4 --close-loop
  - where: Terminal 1
    text: Type yes. This repeats the 2026-11-22 upward cut, where the disarm landed after the feedforward had already decayed to 0, so the offset law was not tested at this speed. Then status and --clear-errors again.
  - where: Hands
    text: 'Do not go faster than --tri-speed 20 in this row. Last, after the second --clear-errors: run status and check it reads state 1 (IDLE). Then press the E-stop button once, run status again, and note whether it still replies and what vbus reads. Release the button afterwards. If the drive lost power its reference is lost; nothing later on this sheet needs it.'
  see: 'For each cut the tri-cut lines. The line ''offset vs the firmware''s last command'' is the result: it should be within 0.05 rev of the ''expected vel_ff/35'' value printed beside it (0.57 rev below after the downward cut and 0.57 above after the upward cut if the echoed vel_ff is still 20; near 0 if it had decayed to 0). Drift near 0 and fault_state NONE both times.'
  stop_if: The Hand keeps moving after a cut or drifts (press the E-stop), a fault will not clear, or the stage refuses or ABORTs a cut (do not change the command to get past it; record the line and go on).
  record: 'For each cut the tri-cut lines (the whole stage output pasted is best). What the E-stop button cuts. Type pending: the verdict is computed at the debrief.'
  serves:
  - item: BUG-105
    do:
    - 3
    - 4
    pass: true
    setup_waived: the bench stage energises the Hand itself with --close-loop, so no earlier step arms it
- n: 9
  kind: restore
  title: Leave the bench safe
  from:
  - bridge-cycled
  to: []
  actions:
  - where: Terminal 1
    command: python tests/hardware/bench_hand_frame_bench.py status
  - where: Hands
    text: Switch the 45 V supply off. Cup empty.
  see: 'state 1 (IDLE) and err 0x0 before the supply goes off. If the E-stop test in step 8 cut the drive''s power, status may not reply at all: that is fine, switch off.'
  stop_if: The drive reads state 8 (closed loop). Run python tests/hardware/hand_stream_bench.py --clear-errors and check again before switching off.
  serves: []
