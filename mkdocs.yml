site_name: Jugglebot Documentation
site_description: Technical documentation for Jugglebot — a Stewart platform robot with ball-catching capabilities
repo_url: https://github.com/Project-DeepBlue-Juggling/Jugglebot
repo_name: Project-DeepBlue-Juggling/Jugglebot

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - def_list
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Motion Planner:
    - Overview: motion_planner/index.md
    - Architecture: motion_planner/architecture.md
    - Kinematics: motion_planner/kinematics.md
    - Dynamics: motion_planner/dynamics.md
    - Trajectory Planning: motion_planner/trajectory.md
    - Workspace Safety: motion_planner/workspace.md
    - Motor Command Safety: motion_planner/safety.md
    - Motor Guard: motion_planner/control_loop.md
    - System Integration: motion_planner/integration.md
    - Operations Guide: motion_planner/operations.md
    - Validation Results: motion_planner/results.md
  - CAN Bridge:
    - Overview: can_bridge/index.md
    - Control Flow: can_bridge/control.md
    - Safety Mechanisms: can_bridge/safety.md
    - Knot-Rate Analysis: knot-rate-analysis.md
  - Simulation MPC (REMOVED 2026-09-01, historical):
    - Overview: sim_mpc/index.md
    - Usage: sim_mpc/usage.md
    - NLP Formulation: sim_mpc/nlp_formulation.md
    - Variable Horizon: sim_mpc/variable_horizon.md
    - Hand & Ball Physics: sim_mpc/hand_and_ball.md
    - Control Loop: sim_mpc/control_loop.md
    - Plant Interface: sim_mpc/plant.md
    - Velocity Tracking: sim_mpc/velocity_tracking.md
    - Tuning Guide: sim_mpc/tuning.md
  - Hardware Analysis:
    - Overview: analysis/index.md
    - Diagnosis Tools: analysis/diagnosis.md
    - Engineering Logbook: analysis/logbook.md
  - Architecture Decisions:
    - Index: adr/index.md
    - "ADR-0001: Offload CAN to MCU": adr/0001-offload-can-and-interpolator-from-jetson.md
    - "ADR-0002: Dedicated second Teensy": adr/0002-dedicated-second-teensy.md
    - "ADR-0003: Teensy 4.1 over 4.0": adr/0003-teensy-4_1-over-4_0.md
    - "ADR-0004: Dual CAN buses": adr/0004-dual-can-buses.md
    - "ADR-0005: Ethernet over USB serial": adr/0005-ethernet-over-usb-serial.md
    - "ADR-0006: UDP not TCP": adr/0006-udp-not-tcp.md
    - "ADR-0007: Point-to-point static link": adr/0007-point-to-point-static-link.md
    - "ADR-0008: Time-sync master on can-bridge": adr/0008-time-sync-master-on-can-bridge.md
    - "ADR-0009: FreeRTOS (tsandmann fork)": adr/0009-freertos-tsandmann-port.md
    - "ADR-0010: On-board clock sufficient": adr/0010-onboard-clock-sufficient.md
    - "ADR-0011: MAC-pinned nmcli": adr/0011-mac-pinned-nmcli.md
    - "ADR-0012: Hermite interpolator port": adr/0012-hermite-interpolator-port.md
    - "ADR-0013: Three CAN buses": adr/0013-three-can-buses.md
