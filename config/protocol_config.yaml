# jugglebot_protocol.yaml
# Single source of truth for all CAN protocol constants shared across
# the Jugglebot codebase (ROS2 Python, Ball Butler Teensy, Platform Teensy).
#
# Run `python generate_config.py` to regenerate:
#   config/generated/jugglebot_protocol.h   (C++ constexpr header)
#   config/generated/jugglebot_protocol.py  (Python constants module)
#
# Constants that are NOT shared (e.g. PID gains, trajectory physics,
# mechanical limits) remain in their respective files.

# =============================================================================
# ODrive CAN Protocol
# =============================================================================
odrive:
  # Command IDs (lower 5 bits of CAN arbitration ID)
  commands:
    get_version:              0x00
    heartbeat_message:        0x01
    get_error:                0x03
    RxSdo:                    0x04
    TxSdo:                    0x05
    set_requested_state:      0x07
    get_encoder_estimate:     0x09
    set_controller_mode:      0x0B
    set_input_pos:            0x0C
    set_input_vel:            0x0D
    set_input_torque:         0x0E
    set_vel_curr_limits:      0x0F
    set_traj_vel_limit:       0x11
    set_traj_acc_limits:      0x12
    get_iq:                   0x14
    get_temps:                0x15
    reboot_odrives:           0x16
    get_bus_voltage_current:  0x17
    clear_errors:             0x18
    set_absolute_position:    0x19
    set_pos_gain:             0x1A
    set_vel_gains:            0x1B

  # Axis states (AxisState enum)
  states:
    IDLE:                   1
    ENCODER_INDEX_SEARCH:   6
    CLOSED_LOOP:            8

  # Control modes (ControlMode enum)
  control_modes:
    VOLTAGE:   0
    TORQUE:    1
    VELOCITY:  2
    POSITION:  3

  # Input modes (InputMode enum)
  input_modes:
    PASSTHROUGH:  1
    VEL_RAMP:     2
    POS_FILTER:   3
    TRAP_TRAJ:    5

  # Known error bit masks
  errors:
    BRAKE_RESISTOR_DISARMED: 0x08000000

# =============================================================================
# CAN Bus
# =============================================================================
can_bus:
  baud_rate: 1000000           # 1 Mbps — all nodes must agree
  bits_per_frame_approx: 111   # Approx bits per 8-byte CAN frame (before bit-stuffing)

# =============================================================================
# CAN Node IDs
# =============================================================================
node_ids:
  legs: [0, 1, 2, 3, 4, 5]
  jugglebot_hand: 6
  bb_pitch: 7
  bb_hand: 8

# =============================================================================
# Custom CAN Message IDs
# =============================================================================
can_ids:
  # Shared IDs — used by both Platform and Ball Butler Teensys
  shared:
    TIME_SYNC:      0x7DD   # Wall-clock sync broadcast (sent by Host, received by both Teensys)

  # Platform Teensy <-> Host
  platform:
    TRAJ_CMD:       0x6D0
    STATE_UPDATE:   0x6E0
    TILT_READING:   0x7DE
    TRAFFIC_REPORT: 0x7DF

  # Ball Butler Teensy <-> Host
  ball_butler:
    THROW_CMD:        0x7D0
    HEARTBEAT:        0x7D1
    RELOAD_CMD:       0x7D2
    RESET_CMD:        0x7D3
    CALIBRATE_LOC_CMD: 0x7D4
    CMD_RESULT:       0x7D5   # BB→host loud command-outcome channel (Phase 2)

  # Catching Cone Teensy <-> Host
  catching_cone:
    CATCH_EVENT:      0x7E0
    HEARTBEAT:        0x7E1

  # Electronic Clapboard <-> Host, on the CONE BUS (the can-bridge's physical
  # CAN3 peripheral, which has hosted the cone role since the 2026-07-31 bus-role
  # swap). The clapboard and the catching cone are MUTUALLY EXCLUSIVE by physical
  # connection — one peripheral on that segment, ever — so the two id blocks
  # coexist in software and which device is attached is knowable only from the
  # arbitration ids arriving.
  #
  # NORMATIVE SOURCE: ~/Desktop/Github/Electronic-Clapboard docs/protocol.md §8.2.
  # That section is a cross-repository contract; neither side may change it
  # unilaterally. Do not invent ids here — copy them from there.
  #
  # Distinct ids (rather than reusing 0x7E0/0x7E1, which would be technically
  # possible given the mutual exclusion) make a MIS-PLUG DIAGNOSABLE: frames
  # arrive, land in no decode branch and show up as bare relay counts, instead of
  # a clapboard heartbeat silently decoding as a catch event and injecting
  # phantom catches into catch_correlation_node.
  clapboard:
    FIELD:            0x7E8   # J→C   one 7-byte chunk of one field's text
    COMMIT:           0x7E9   # J→C   close a transaction: template, mask, CRC
    LINK:             0x7EA   # B→C   2 Hz ROS2-up/down beacon (bridge-sourced)
    ACK:              0x7EB   # C→J   transaction outcome + measured render_ms
    HEARTBEAT:        0x7EC   # C→J   10 Hz liveness; ALSO what opens the TX gate
    FIRE_EVENT:       0x7ED   # C→J   wall-clock instant of an accepted flash
    # Inclusive bounds of the WHOLE allocation, reserved 0x7EE-0x7EF included.
    # A frame anywhere in this block can only have come from a clapboard, so for
    # the presence question the whole block is the right answer and a future
    # allocation needs no code edit. Consumed by the firmware's is_clapboard_id()
    # (can_buses.h) and mirrors the peer's own ID_CLAP_BLOCK_FIRST/LAST.
    BLOCK_FIRST:      0x7E8
    BLOCK_LAST:       0x7EF

# =============================================================================
# Ball Butler State Machine
# =============================================================================
ball_butler:
  # If no CAN heartbeat frame is received within this window, BB is considered disconnected
  heartbeat_timeout_ms: 500

  # States — encoded in heartbeat byte 0 (bits 1-7)
  states:
    BOOT:          0
    IDLE:          1
    TRACKING:      2
    THROWING:      3
    RELOADING:     4
    CALIBRATING:   5
    CHECKING_BALL: 6
    ERROR:         127

  # Error codes — encoded in heartbeat byte 1 when state == ERROR
  errors:
    NONE:           0
    RELOAD_FAILED:  1

  # ── Loud command-outcome channel (CMD_RESULT frame, 0x7D5) ─────────────────
  # One CMD_RESULT per operator command, published by BB firmware at the command's
  # terminal point and relayed CAN1→UDP by the can-bridge. 8-byte frame layout:
  #   byte0   = command_type   (which operation)
  #   byte1   = command_outcome
  #   bytes2-3 = detail0 (int16, little-endian)
  #   bytes4-5 = detail1 (int16, little-endian)
  #   bytes6-7 = reserved
  # The throw is the first consumer; reload/calibrate/home are future consumers.

  # command_type — CMD_RESULT byte 0
  command_types:
    THROW:        0
    RELOAD:       1
    CALIBRATE:    2
    HOME:         3

  # command_outcome — CMD_RESULT byte 1. A shared base enum (0x00-0x0F) reused by
  # every command, plus per-command extension values (>=0x20) carrying the specific
  # reason. detail0/detail1 are generic int16s the consumer interprets per command_type.
  command_outcomes:
    # Shared base outcomes (apply to any command)
    OK:                            0x00
    REJECTED:                      0x01
    ABORTED:                       0x02
    TIMEOUT:                       0x03
    BUSY:                          0x04
    # THROW-specific reasons (0x20+). For these, detail0 = binding axis
    # (0=YAW, 1=PITCH, 2=BOTH, -1=n/a); detail1 = a context metric (e.g. lead
    # shortfall ms for CANT_MAKE_LEAD, yaw error centideg for NOT_SETTLED).
    THROW_REJECTED_NO_BALL:        0x20
    THROW_REJECTED_NO_TIMESYNC:    0x21
    THROW_REJECTED_BAD_STATE:      0x22
    THROW_REJECTED_CANT_MAKE_LEAD: 0x23
    THROW_REJECTED_HAND_NOT_HOMED: 0x24
    THROW_REJECTED_PV_UNAVAILABLE: 0x25
    THROW_REJECTED_PV_STALE:       0x26
    THROW_REJECTED_PLANNER_EMPTY:  0x27
    THROW_REJECTED_ARM_FAIL:       0x28
    THROW_ABORTED_NOT_SETTLED:     0x29

# =============================================================================
# Catching Cone State Machine
# =============================================================================
catching_cone:
  # If no CAN heartbeat frame is received within this window, the cone is considered disconnected
  heartbeat_timeout_ms: 500

  # States — encoded in CONE_HEARTBEAT byte 0
  states:
    BOOT:      0
    UNSYNCED:  1   # running, no time-sync acquired yet
    READY:     2   # synced, armed, waiting for an impact
    ERROR:     127

# =============================================================================
# Electronic Clapboard
# =============================================================================
# Wire contract: ~/Desktop/Github/Electronic-Clapboard docs/protocol.md §8.6-8.8.
clapboard:
  # If no CLAP_HEARTBEAT frame is received within this window, the clapboard is
  # considered disconnected. The clapboard heartbeats at 10 Hz UNCONDITIONALLY
  # from boot (§8.1/§8.7 — it must transmit first, because the bridge's TX gate
  # will not speak on a bus where no partner has been heard), so 500 ms is five
  # missed frames — the same margin the catching cone's identical 10 Hz
  # heartbeat gets, and this presence verdict is timed HOST-SIDE off UDP
  # arrival rather than mirrored from a firmware flag the way Ball Butler's is
  # (which would cost new heartbeat flag bits, a regenerate and a reflash for
  # something the Jetson can time perfectly well with a clock it already has).
  heartbeat_timeout_ms: 500

  # States — encoded in CLAP_HEARTBEAT byte 0 (§8.7). NOTE the values differ
  # from the catching cone's (whose ERROR is 127): this enum is the clapboard
  # repo's can_frames::State and is copied from it verbatim.
  states:
    BOOT:         0
    IDLE:         1
    RENDERING:    2
    SCREENSAVER:  3
    ERROR:        4

  # Transaction outcomes — encoded in CLAP_ACK byte 1 (§8.6). Read by the
  # SetSlate action (a later phase) and surfaced as the heartbeat's last_error.
  ack_outcomes:
    OK:            0x00   # committed and painted
    REJECTED:      0x01   # generic refusal
    CRC_MISMATCH:  0x02   # reassembled payload failed the CRC
    INCOMPLETE:    0x03   # mask named a field with missing chunks
    BUSY:          0x04   # a render was already in flight
    NO_TEMPLATE:   0x05   # template_id not present in flash
    BAD_FIELD_ID:  0x06   # a chunk carried field_id > 7

# =============================================================================
# Encoding / Scaling
# =============================================================================
encoding:
  # Ball Butler heartbeat CAN frame encoding resolutions
  heartbeat:
    yaw_res_deg:   0.01
    pitch_res_deg: 0.002
    hand_res_mm:   0.01

  # ODrive input scaling factors (vel_ff and torque_ff are sent as int16 * scale).
  # The hand axis uses lower scale values (100) to allow larger feedforward
  # ranges for its high-speed throw trajectories.  Leg torque uses 10000 for
  # 0.0001 Nm/count resolution on small gravity feedforward torques (max ±3.2 Nm).
  # These must match the ODrive firmware config: axis0.config.can.input_vel_scale
  # and axis0.config.can.input_torque_scale on each drive.
  input_scales:
    # Hand axis (CAN ID 6) — matches odrive_pro_hand_config.json
    hand_vel: 100.0
    hand_tor: 100.0
    # Leg axes (CAN IDs 0-5) — matches odrive_pro_leg_config.json
    leg_vel: 1000.0
    leg_tor: 10000.0

# =============================================================================
# SDO (Arbitrary Parameter Access)
# =============================================================================
sdo:
  OPCODE_READ:  0x00
  OPCODE_WRITE: 0x01

# =============================================================================
# Endpoint IDs (ODrive internal parameter addresses)
# =============================================================================
endpoints:
  # ODrive endpoint ids are firmware-build-specific (flat_endpoints.json).
  # Qualified by (board, fw). A consumer MUST verify Get_Version before use.
  odrive_pro_0_6_11:            # hw 4.4.58, fw 0.6.11 and 0.6.11-1 (tree CRC 55416)
    get_gpio_states: 726
  odrive_s1_0_6_11:             # BallButler hand (hw 5.2.0) — values proven in production on BB
    get_gpio_states: 700
    commutation_mapper_pos_abs: 488

# =============================================================================
# Motion Capture Alignment
# =============================================================================
# The "Base" rigid body in QTM must be near the global origin for mocap data
# to be trustworthy.  When the base drifts beyond these thresholds the mocap
# node stops publishing rigid body poses and flags the data as misaligned.
#
# RELAXED 2026-06-10 (was 2.5 mm / 1.0 deg): the "Base" body currently sits
# ~444 mm off the QTM origin, which failed the tight gate and suppressed
# /rigid_body_poses entirely.  The gate only un-blocks publishing — it
# transforms no poses, and BB accuracy calibration does not use is_aligned — so
# relaxing it is safe.  Restore 2.5 / 1.0 if the QTM frame is ever re-zeroed
# (which would also invalidate the current BB calibration).  See BallButler
# logbook/2026-06-10-throw-aim-correction-validated.md.
mocap_alignment:
  pos_thresh_mm:  2000.0   # Euclidean distance from origin
  rot_thresh_deg: 180.0    # Rotation angle from identity
