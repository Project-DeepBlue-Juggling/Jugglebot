# jugglebot_protocol.yaml
# Single source of truth for all CAN protocol constants shared across
# the Jugglebot codebase (ROS2 Python, Ball Butler Teensy, Platform Teensy).
#
# Run `python generate_config.py` to regenerate:
#   config/generated/jugglebot_protocol.h   (C++ constexpr header)
#   config/generated/jugglebot_protocol.py  (Python constants module)
#
# Constants that are NOT shared (e.g. PID gains, trajectory physics,
# mechanical limits) remain in their respective files.

# =============================================================================
# ODrive CAN Protocol
# =============================================================================
odrive:
  # Command IDs (lower 5 bits of CAN arbitration ID)
  commands:
    get_version:              0x00
    heartbeat_message:        0x01
    get_error:                0x03
    RxSdo:                    0x04
    TxSdo:                    0x05
    set_requested_state:      0x07
    get_encoder_estimate:     0x09
    set_controller_mode:      0x0B
    set_input_pos:            0x0C
    set_input_vel:            0x0D
    set_input_torque:         0x0E
    set_vel_curr_limits:      0x0F
    set_traj_vel_limit:       0x11
    set_traj_acc_limits:      0x12
    get_iq:                   0x14
    get_temps:                0x15
    reboot_odrives:           0x16
    get_bus_voltage_current:  0x17
    clear_errors:             0x18
    set_absolute_position:    0x19
    set_pos_gain:             0x1A
    set_vel_gains:            0x1B

  # Axis states (AxisState enum)
  states:
    IDLE:                   1
    ENCODER_INDEX_SEARCH:   6
    CLOSED_LOOP:            8

  # Control modes (ControlMode enum)
  control_modes:
    VOLTAGE:   0
    TORQUE:    1
    VELOCITY:  2
    POSITION:  3

  # Input modes (InputMode enum)
  input_modes:
    PASSTHROUGH:  1
    VEL_RAMP:     2
    POS_FILTER:   3
    TRAP_TRAJ:    5

  # Known error bit masks
  errors:
    BRAKE_RESISTOR_DISARMED: 0x08000000

# =============================================================================
# CAN Bus
# =============================================================================
can_bus:
  baud_rate: 1000000           # 1 Mbps — all nodes must agree
  bits_per_frame_approx: 111   # Approx bits per 8-byte CAN frame (before bit-stuffing)

# =============================================================================
# CAN Node IDs
# =============================================================================
node_ids:
  legs: [0, 1, 2, 3, 4, 5]
  jugglebot_hand: 6
  bb_pitch: 7
  bb_hand: 8

# =============================================================================
# Custom CAN Message IDs
# =============================================================================
can_ids:
  # Shared IDs — used by both Platform and Ball Butler Teensys
  shared:
    TIME_SYNC:      0x7DD   # Wall-clock sync broadcast (sent by Host, received by both Teensys)

  # Platform Teensy <-> Host
  platform:
    # TRAJ_CMD 0x6D0 (the hand stroke-engine command) RETIRED 2026-09-11 at skill-stack R1 — the id is never reused.
    STATE_UPDATE:   0x6E0
    TILT_READING:   0x7DE
    TRAFFIC_REPORT: 0x7DF
    # Over-CAN firmware update (2026-09-09): host -> Platform via the bridge's typed
    # relay on FW_UPDATE_CMD; the Platform answers on FW_UPDATE_REPLY, which the
    # bridge uplinks verbatim as a PLATFORM_FRAME. The USB port is damaged.
    FW_UPDATE_CMD:   0x6F0
    FW_UPDATE_REPLY: 0x6F1

  # Ball Butler Teensy <-> Host
  ball_butler:
    THROW_CMD:        0x7D0
    HEARTBEAT:        0x7D1
    RELOAD_CMD:       0x7D2
    RESET_CMD:        0x7D3
    CALIBRATE_LOC_CMD: 0x7D4
    CMD_RESULT:       0x7D5   # BB→host loud command-outcome channel (Phase 2)
    # Over-CAN firmware update (2026-09-28): the Platform's 0x6F0/0x6F1 contract
    # (same opcodes, statuses and frame layouts) on BB's own ids — deliberately NOT
    # 0x6F0/0x6F1 on CAN1, so a bridge bus-role swap can never route a Platform
    # flash to BB. The bridge's typed relay sends FW_UPDATE_CMD on CAN1; BB answers
    # on FW_UPDATE_REPLY, which the bridge uplinks verbatim as a PLATFORM_FRAME.
    FW_UPDATE_CMD:    0x7D6
    FW_UPDATE_REPLY:  0x7D7
    # Stamped 100 Hz yaw (2026-10-09): BB -> bridge, one frame per fresh 150 Hz
    # YawAxis sample. 8 bytes LE: f32 yaw_deg (BB-local, unwrapped — the heartbeat's
    # quantity before its [0,360) wrap + 0.01 deg truncation) | i16 yaw velocity in
    # encoding.yaw_estimate.vel_res_dps counts | u16 sample age at TX (us, BB
    # monotonic, saturating). The bridge relays it as UDP BB_YAW_ESTIMATE paired with
    # BB_AXIS_ESTIMATES -> /bb/axis_estimates name bb_yaw. The 10 Hz heartbeat yaw is
    # unchanged. Low-priority BB id (only CANCEL_CMD 0x7D9 is lower): it never outranks ODrive control traffic.
    YAW_ESTIMATE:     0x7D8
    # Throw CANCEL (2026-10-13, R5 sitting 7 decision 5): host -> BB, payloadless.
    # Aborts a queued/armed throw whose wind-up has not started (ball retained, BB
    # back to IDLE); a no-op once the first wind-up frame is out. BB answers on
    # CMD_RESULT with command_type CANCEL, and an aborted throw's own terminal
    # CMD_RESULT is THROW_ABORTED_BY_HOST. Now the lowest-priority BB id: it can
    # only follow a THROW_CMD queued alongside it (0x7D0 wins arbitration), never
    # overtake it.
    CANCEL_CMD:       0x7D9

  # Catching Cone Teensy <-> Host
  catching_cone:
    CATCH_EVENT:      0x7E0
    HEARTBEAT:        0x7E1

  # Freefly Wave camera adapter (ESP32) <-> Host, 2026-10-19. Rides the cone-role
  # bus (the bridge's CAN3 peripheral); the cone and the camera adapter are
  # mutually exclusive on that drop (owner decision). All frames DLC 8, LE.
  # Contract: ros_ws/docs/wave_camera_can_adapter.md s4; ADR-0014.
  wave_camera:
    CMD:              0x7E2   # J->W  5 Hz recording intent (desired, cmd_seq, flags, session_id)
    HEARTBEAT:        0x7E3   # W->J  10 Hz liveness from boot; ALSO what opens the bridge TX gate
    REC_EVENT:        0x7E4   # W->J  start/stop/auto-stop/refused, 40-bit event time
    INFO:             0x7E5   # W->J  paged diagnostics, one page every 333 ms
    # Inclusive bounds of the whole allocation; 0x7E6-0x7E7 are reserved.
    BLOCK_FIRST:      0x7E2
    BLOCK_LAST:       0x7E7

# =============================================================================
# Ball Butler State Machine
# =============================================================================
ball_butler:
  # If no CAN heartbeat frame is received within this window, BB is considered disconnected
  heartbeat_timeout_ms: 500

  # States — encoded in heartbeat byte 0 (bits 1-7)
  states:
    BOOT:          0
    IDLE:          1
    TRACKING:      2
    THROWING:      3
    RELOADING:     4
    CALIBRATING:   5
    CHECKING_BALL: 6
    ERROR:         127

  # Error codes — encoded in heartbeat byte 1 when state == ERROR
  errors:
    NONE:           0
    RELOAD_FAILED:  1

  # ── Loud command-outcome channel (CMD_RESULT frame, 0x7D5) ─────────────────
  # One CMD_RESULT per operator command, published by BB firmware at the command's
  # terminal point and relayed CAN1→UDP by the can-bridge. 8-byte frame layout:
  #   byte0   = command_type   (which operation)
  #   byte1   = command_outcome
  #   bytes2-3 = detail0 (int16, little-endian)
  #   bytes4-5 = detail1 (int16, little-endian)
  #   bytes6-7 = reserved
  # The throw is the first consumer; reload/calibrate/home are future consumers.

  # command_type — CMD_RESULT byte 0
  command_types:
    THROW:        0
    RELOAD:       1
    CALIBRATE:    2
    HOME:         3
    CANCEL:       4   # throw cancel (CANCEL_CMD 0x7D9); detail1 = ms to release at receipt

  # command_outcome — CMD_RESULT byte 1. A shared base enum (0x00-0x0F) reused by
  # every command, plus per-command extension values (>=0x20) carrying the specific
  # reason. detail0/detail1 are generic int16s the consumer interprets per command_type.
  command_outcomes:
    # Shared base outcomes (apply to any command)
    OK:                            0x00
    REJECTED:                      0x01
    ABORTED:                       0x02
    TIMEOUT:                       0x03
    BUSY:                          0x04
    # THROW-specific reasons (0x20+). For these, detail0 = binding axis
    # (0=YAW, 1=PITCH, 2=BOTH, -1=n/a); detail1 = a context metric (e.g. lead
    # shortfall ms for CANT_MAKE_LEAD, yaw error centideg for NOT_SETTLED).
    THROW_REJECTED_NO_BALL:        0x20
    THROW_REJECTED_NO_TIMESYNC:    0x21
    THROW_REJECTED_BAD_STATE:      0x22
    THROW_REJECTED_CANT_MAKE_LEAD: 0x23
    THROW_REJECTED_HAND_NOT_HOMED: 0x24
    THROW_REJECTED_PV_UNAVAILABLE: 0x25
    THROW_REJECTED_PV_STALE:       0x26
    THROW_REJECTED_PLANNER_EMPTY:  0x27
    THROW_REJECTED_ARM_FAIL:       0x28
    THROW_ABORTED_NOT_SETTLED:     0x29
    # The throw's terminal outcome when a host CANCEL_CMD (0x7D9) aborted it
    # before wind-up: no frame sent, ball retained, BB back to IDLE. detail0 = -1;
    # detail1 = ms that were left to the release instant.
    THROW_ABORTED_BY_HOST:         0x2A
    # CANCEL-specific reasons (command_type CANCEL). A cancel that aborted a
    # throw answers OK (detail1 = ms left to release). detail1 = ms to release
    # (negative = already past) for TOO_LATE, 0 for NOTHING_PENDING.
    CANCEL_NOTHING_PENDING:        0x2B   # no throw queued or armed: nothing to cancel
    CANCEL_TOO_LATE:               0x2C   # wind-up already started: the throw proceeds

# =============================================================================
# Catching Cone State Machine
# =============================================================================
catching_cone:
  # If no CAN heartbeat frame is received within this window, the cone is considered disconnected
  heartbeat_timeout_ms: 500

  # States — encoded in CONE_HEARTBEAT byte 0
  states:
    BOOT:      0
    UNSYNCED:  1   # running, no time-sync acquired yet
    READY:     2   # synced, armed, waiting for an impact
    ERROR:     127

# =============================================================================
# Wave camera adapter (ESP32 on the cone-role bus)
# =============================================================================
# Wire contract: ros_ws/docs/wave_camera_can_adapter.md s4 (frame tables, ack
# semantics s4.5). ADR: docs/adr/0014-wave-camera-on-can3.md.
wave_camera:
  # Host-side presence: no WAVE_HEARTBEAT (10 Hz) within this window -> disconnected.
  heartbeat_timeout_ms: 500
  # The node streams WAVE_CMD at this rate whenever the heartbeat is fresh,
  # desired=0 included, so a lost stop is repaired within one period.
  intent_rate_hz: 5
  # ESP-side: no WAVE_CMD for this long while STARTING/RECORDING -> AUTO_STOP
  # INTENT_TIMEOUT with GPI2 released. Mirrored here for the docs and tests.
  intent_timeout_ms: 3000

  # States — WAVE_HEARTBEAT byte 0
  states:
    BOOT:       0
    IDLE:       1
    STARTING:   2
    RECORDING:  3
    STOPPING:   4
    FAULT:      5

  # Event kinds — WAVE_REC_EVENT byte 5 bits 0-2
  event_kinds:
    START:      1
    STOP:       2
    AUTO_STOP:  3
    REFUSED:    4

  # Reasons — WAVE_REC_EVENT byte 5 bits 5-7
  reasons:
    NONE:            0
    NO_CHANGE:       1   # already in the requested state
    INTENT_TIMEOUT:  2
    TICK_LOST:       3
    CAMERA_OFF:      4
    CLIP_MISSING:    5   # START without the "Created new clip." line; GPI2 kept low
    CONSOLE_OWNS:    6
    GPI2_FAULT:      7

# =============================================================================
# Encoding / Scaling
# =============================================================================
encoding:
  # Ball Butler heartbeat CAN frame encoding resolutions
  heartbeat:
    yaw_res_deg:   0.01
    pitch_res_deg: 0.002
    hand_res_mm:   0.01

  # Ball Butler YAW_ESTIMATE (0x7D8) CAN frame encoding: yaw velocity as int16 counts.
  # 0.1 deg/s gives +-3276 deg/s, covering YawAxis's 2 rev/s (720 deg/s) glitch
  # threshold; yaw position rides as an f32 (no quantisation beyond float).
  yaw_estimate:
    vel_res_dps:   0.1

  # ODrive input scaling factors (vel_ff and torque_ff are sent as int16 * scale).
  # The hand VELOCITY scale stays 100 (0.01 rev/s/count, +-327 rev/s range for
  # throws); the hand TORQUE scale is 1000 since FW 22 (C2FF, 2026-09-14): the
  # firmware torque feedforward is clamped at 0.234 Nm, and 100 gave 0.01 Nm =
  # 1.81 A per count, a staircase.  1000 MUST match the hand ODrive's
  # can.input_torque_scale -- a mismatch is a silent 10x torque error, which is
  # why the bridge reads it back before the FF gain may leave 0.  Leg torque uses 10000 for
  # 0.0001 Nm/count resolution on small gravity feedforward torques (max ±3.2 Nm).
  # These must match the ODrive firmware config: axis0.config.can.input_vel_scale
  # and axis0.config.can.input_torque_scale on each drive.
  input_scales:
    # Hand axis (CAN ID 6) — matches odrive_pro_hand_config.json
    hand_vel: 100.0
    hand_tor: 1000.0
    # Leg axes (CAN IDs 0-5) — matches odrive_pro_leg_config.json
    leg_vel: 1000.0
    leg_tor: 10000.0
    # ---- Ball Butler: its own drives, its own keys (2026-10-10) ----
    # "Each axis with unique limits has its own set of keys": BB's firmware
    # used hand_vel/hand_tor (Jugglebot's hand Pro) for its own drives, so the
    # FW 22 change of hand_tor 100 -> 1000 silently became a 10x torque
    # feedforward on BB's hand when BB FW 6 regenerated this header.  BB's
    # CanInterface picks the pair by node; the Jugglebot keys above never
    # reach a BB drive.  BB's yaw is a brushed DC motor on an H-bridge (PWM),
    # not an ODrive, and has no keys.
    # BB hand (CAN ID 8, ODrive S1) — matches odrive_s1_bb_hand_config.json
    # (owner read node 8 input_torque_scale = 100 with odrivetool, 2026-10-10).
    bb_hand_vel: 100.0
    bb_hand_tor: 100.0
    # BB pitch (CAN ID 7, ODrive Micro) — matches BallButler's
    # bb_pitch_odrive_micro_config.json.  That file is a 2026-03 snapshot whose
    # node_id reads 0 (the live drive is 7), so these two values are NOT
    # confirmed against the live drive.  Wire-inert today: PitchAxis sends
    # vel_ff = tor_ff = 0 (TRAP_TRAJ), and 0 * any scale is 0.  Read the drive
    # back before ever sending pitch feedforward.
    bb_pitch_vel: 1000.0
    bb_pitch_tor: 1000.0

# =============================================================================
# SDO (Arbitrary Parameter Access)
# =============================================================================
sdo:
  OPCODE_READ:  0x00
  OPCODE_WRITE: 0x01

# =============================================================================
# Endpoint IDs (ODrive internal parameter addresses)
# =============================================================================
endpoints:
  # ODrive endpoint ids are firmware-build-specific (flat_endpoints.json).
  # Qualified by (board, fw). A consumer MUST verify Get_Version before use.
  odrive_pro_0_6_11:            # hw 4.4.58, fw 0.6.11 and 0.6.11-1 (tree CRC 55416)
    get_gpio_states: 726
    # axis0.config.can.input_torque_scale (uint32, rw) — flat_endpoints.json for
    # ODrive Pro v4.4-58V 0.6.11 AND 0.6.11-1 (same id in both; fetched 2026-09-14
    # from api.odriverobotics.com/releases/firmware/index, whose get_gpio_states
    # reads 726 in the same file). Read by the FW 22 hand torque-scale readback.
    can_input_torque_scale: 283
  odrive_s1_0_6_11:             # BallButler hand, CAN node 8 (hw 5.2.0)
    # Source for every id in this block (2026-10-10): the ODrive S1 flat
    # endpoint table "config/ODrive config Files/odrive-s1-0.6.11-1_flat_endpoints.json"
    # (fw_version 0.6.11-1, hw_version 5.2.0, tree crc 52326, 631 endpoints),
    # supplied by the owner.  The Pro's ids above come from the Pro's own table;
    # never copy an id between the two boards.
    get_gpio_states: 700          # function; invoked on the wire by BB's ball-in-hand poll every session
    # axis0.commutation_mapper.pos_abs (float, r).  Was 488 until 2026-10-10,
    # labelled "proven in production": in this table 488 is
    # axis0.task_times.can_heartbeat.length.  No firmware sends it (BB's only
    # caller, CanInterface::isEncoderSearchComplete, is never called).
    commutation_mapper_pos_abs: 451
    # BB FW 8 hand input-scale guard: SDO READ (opcode 0) at every hand arm,
    # compared with input_scales.bb_hand_tor / bb_hand_vel.
    can_input_torque_scale: 273   # axis0.config.can.input_torque_scale (uint32, rw)
    can_input_vel_scale: 272      # axis0.config.can.input_vel_scale (uint32, rw)
    can_node_id: 262              # axis0.config.can.node_id (uint32, rw) — guard log only
    fw_version_major: 10          # uint8, r — guard log only
    fw_version_minor: 11          # uint8, r — guard log only
    fw_version_revision: 12       # uint8, r — guard log only
    hw_version_major: 6           # uint8, r — not read by any firmware yet
    hw_version_minor: 7           # uint8, r — not read by any firmware yet
